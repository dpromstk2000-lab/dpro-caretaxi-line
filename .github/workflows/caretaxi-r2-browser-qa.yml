name: CARETAXI R2 Fresh Browser QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/caretaxi-r2-browser-qa.yml'

permissions:
  contents: read

jobs:
  fresh-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run CARETAXI R2 fresh browser QA
        shell: bash
        run: |
          cat > /tmp/caretaxi-r2-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const runStamp = new Date().toISOString();
          const cacheBust = Date.now();
          const sourceHead = process.env.GITHUB_SHA || '';
          const outDir = 'CARETAXI_R2_BROWSER_QA';
          fs.mkdirSync(outDir, { recursive: true });

          const targets = [
            {
              item: 'READY-018',
              label: 'PC 1440',
              width: 1440,
              height: 1000,
              url: `https://dpromstk2000-lab.github.io/dpro-caretaxi-line/?demo=1&r2qa=${cacheBust}`,
              kind: 'request'
            },
            {
              item: 'READY-019',
              label: 'Mobile 390',
              width: 390,
              height: 844,
              url: `https://dpromstk2000-lab.github.io/dpro-caretaxi-line/?demo=1&r2qa=${cacheBust}`,
              kind: 'request'
            },
            {
              item: 'READY-020',
              label: 'Mobile 320',
              width: 320,
              height: 720,
              url: `https://dpromstk2000-lab.github.io/dpro-caretaxi-line/?demo=1&r2qa=${cacheBust}`,
              kind: 'request'
            },
            {
              item: 'READY-021',
              label: 'iPad 1024',
              width: 1024,
              height: 900,
              url: `https://dpromstk2000-lab.github.io/dpro-caretaxi-line/owner-ipad.html?demo=1&r2qa=${cacheBust}`,
              kind: 'ipad'
            }
          ];

          const isApi = (url) => /workers\.dev|\/api\/|\/v1\//i.test(url);
          const sha256 = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const results = [];
          const browser = await chromium.launch({ headless: true });

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: target.width, height: target.height },
              deviceScaleFactor: 1,
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo',
              colorScheme: 'light'
            });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            const apiFailures = [];
            const badResponses = [];

            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => pageErrors.push(String(err?.stack || err?.message || err)));
            page.on('requestfailed', req => {
              const rec = { url: req.url(), method: req.method(), failure: req.failure()?.errorText || 'unknown' };
              requestFailures.push(rec);
              if (isApi(req.url())) apiFailures.push({ type: 'requestfailed', ...rec });
            });
            page.on('response', resp => {
              if (resp.status() >= 400) {
                const rec = { url: resp.url(), status: resp.status(), method: resp.request().method() };
                badResponses.push(rec);
                if (isApi(resp.url())) apiFailures.push({ type: 'http', ...rec });
              }
            });

            let navigationStatus = 0;
            let navigationOk = false;
            let operationalView = false;
            let loginAttempted = false;
            let loginError = '';
            let thrown = '';

            try {
              const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              navigationStatus = response?.status() || 0;
              navigationOk = !!response && response.ok();
              await page.waitForTimeout(1200);

              if (target.kind === 'ipad') {
                const loginVisible = await page.locator('#loginView').isVisible().catch(() => false);
                if (loginVisible) {
                  loginAttempted = true;
                  await page.locator('#adminCode').fill('1234');
                  await page.locator('#loginForm button[type="submit"]').click();
                  try {
                    await page.locator('#appView').waitFor({ state: 'visible', timeout: 20000 });
                    await page.waitForTimeout(1800);
                  } catch {
                    loginError = await page.locator('#loginError').textContent().catch(() => '') || 'appView did not become visible';
                  }
                }
                operationalView = await page.locator('#appView').isVisible().catch(() => false)
                  && await page.locator('#board').count().then(n => n > 0).catch(() => false);
              } else {
                operationalView = await page.locator('h1').isVisible().catch(() => false)
                  && await page.locator('form').count().then(n => n > 0).catch(() => false);
              }

              await page.waitForTimeout(700);
            } catch (e) {
              thrown = String(e?.stack || e?.message || e);
            }

            const metrics = await page.evaluate(() => {
              const de = document.documentElement;
              const body = document.body;
              const clientWidth = de.clientWidth;
              const scrollWidth = Math.max(de.scrollWidth, body?.scrollWidth || 0);
              const interactive = [...document.querySelectorAll('button,a,input,select,textarea')]
                .filter(el => {
                  const s = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                });
              const smallTargets = interactive.filter(el => {
                const r = el.getBoundingClientRect();
                return r.width < 40 || r.height < 40;
              }).length;
              return {
                innerWidth: window.innerWidth,
                clientWidth,
                scrollWidth,
                overflowPx: Math.max(0, scrollWidth - clientWidth),
                bodyTextLength: body?.innerText?.length || 0,
                interactiveCount: interactive.length,
                smallTargets
              };
            }).catch(() => ({ innerWidth: 0, clientWidth: 0, scrollWidth: 0, overflowPx: 9999, bodyTextLength: 0, interactiveCount: 0, smallTargets: 0 }));

            const safe = target.item.toLowerCase();
            const screenshot = `${outDir}/${safe}_${target.width}x${target.height}.png`;
            await page.screenshot({ path: screenshot, fullPage: true }).catch(() => {});

            const result = {
              item: target.item,
              label: target.label,
              requestedViewport: `${target.width}x${target.height}`,
              url: target.url,
              finalUrl: page.url(),
              navigationStatus,
              navigationOk,
              operationalView,
              loginAttempted,
              loginError,
              metrics,
              consoleErrors,
              pageErrors,
              requestFailures,
              apiFailures,
              badResponses,
              thrown,
              screenshot,
              screenshotSha256: fs.existsSync(screenshot) ? sha256(screenshot) : null,
              pass: navigationOk
                && operationalView
                && metrics.innerWidth === target.width
                && metrics.overflowPx === 0
                && consoleErrors.length === 0
                && pageErrors.length === 0
                && apiFailures.length === 0
                && !thrown
            };
            results.push(result);
            await context.close();
          }

          await browser.close();

          const allPass = results.every(r => r.pass);
          const report = {
            ok: allPass,
            systemCode: 'CARETAXI',
            auditSequence: 2,
            sourceHead,
            checkedAt: runStamp,
            method: 'GitHub Actions ubuntu-latest / Playwright Chromium / live public URLs / cache-busted',
            results
          };
          fs.writeFileSync(`${outDir}/CARETAXI_R2_BROWSER_QA.json`, JSON.stringify(report, null, 2));

          const lines = [
            'DPRO PRODUCT READY #42 CARETAXI R2 FRESH BROWSER QA',
            `checked_at=${runStamp}`,
            `source_head=${sourceHead}`,
            `method=${report.method}`,
            `overall=${allPass ? 'PASS' : 'FAIL'}`,
            ''
          ];
          for (const r of results) {
            lines.push(`[${r.item}] ${r.label}: ${r.pass ? 'PASS' : 'FAIL'}`);
            lines.push(`url=${r.url}`);
            lines.push(`http=${r.navigationStatus}`);
            lines.push(`innerWidth=${r.metrics.innerWidth}`);
            lines.push(`clientWidth=${r.metrics.clientWidth}`);
            lines.push(`scrollWidth=${r.metrics.scrollWidth}`);
            lines.push(`overflowPx=${r.metrics.overflowPx}`);
            lines.push(`operationalView=${r.operationalView}`);
            lines.push(`consoleErrors=${r.consoleErrors.length}`);
            lines.push(`pageErrors=${r.pageErrors.length}`);
            lines.push(`apiFailures=${r.apiFailures.length}`);
            lines.push(`requestFailures=${r.requestFailures.length}`);
            lines.push(`badResponses=${r.badResponses.length}`);
            lines.push(`screenshotSha256=${r.screenshotSha256 || ''}`);
            if (r.loginError) lines.push(`loginError=${r.loginError}`);
            if (r.thrown) lines.push(`thrown=${r.thrown.replace(/\s+/g, ' ')}`);
            lines.push('');
          }
          fs.writeFileSync(`${outDir}/CARETAXI_R2_BROWSER_QA.txt`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (!allPass) process.exitCode = 1;
          JS
          node /tmp/caretaxi-r2-qa.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caretaxi-r2-browser-qa
          path: CARETAXI_R2_BROWSER_QA/
          if-no-files-found: error
          retention-days: 30
