name: CARETAXI Tutorial R3 Deploy + QA
# QA FIX V1.4 2026-08-27: mobile drag validates vertical movement; keyboard uses ArrowUp

on:
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'tutorial.js'
      - 'tutorial.css'
      - '.github/workflows/caretaxi-tutorial-r3-deploy-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-demo-guide-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch demo-guide loader only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('demo-guide.html')
          s=p.read_text(encoding='utf-8')
          marker='CARETAXI-R3-20260827'
          if marker not in s:
              inject='''\n<!-- DPRO TUTORIAL R3 loader / demo-guide only -->\n<link rel="stylesheet" href="./tutorial.css?v=CARETAXI-R3-20260827">\n<script src="./tutorial.js?v=CARETAXI-R3-20260827" defer></script>\n'''
              if '</head>' not in s:
                  raise SystemExit('demo-guide.html has no </head>')
              s=s.replace('</head>', inject+'</head>', 1)
              p.write_text(s,encoding='utf-8',newline='\n')
          PY

      - name: Commit demo-guide loader if needed
        shell: bash
        run: |
          if git diff --quiet -- demo-guide.html; then
            echo "demo-guide already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-guide.html
          git commit -m "Add CARETAXI Tutorial R3 loader to demo guide"
          git push origin HEAD:main

      - name: Static mutation and syntax audit
        shell: bash
        run: |
          node --check tutorial.js
          python - <<'PY'
          from pathlib import Path
          js=Path('tutorial.js').read_text(encoding='utf-8')
          css=Path('tutorial.css').read_text(encoding='utf-8')
          checks={
            'exactly_10_steps': js.count('{n:')==10,
            'no_fetch': 'fetch(' not in js,
            'no_xhr': 'XMLHttpRequest' not in js,
            'no_business_click': '.click()' not in js,
            'pointer_handle_only': 'handle.addEventListener("pointerdown",startDrag)' in js,
            'interactive_drag_guard': 'button,a,input,select,textarea' in js,
            'highlight_pointer_none': 'pointer-events:none' in css,
            'mobile_width_guard': 'calc(100vw - 24px)' in css,
            'esc_present': 'e.key==="Escape"' in js,
            'replay_present': 'function replay()' in js,
            'menu_id_selector_fixed': '#dpro-tutorial-menu' in css and '.dpro-tutorial-menu' not in css,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('Static R3 audit failed: '+','.join(bad))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages R3 assets
        shell: bash
        run: |
          node <<'JS'
          const marker='CARETAXI-TUTORIAL-R3-V1.0-20260827';
          const asset='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/tutorial.js';
          const guide='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/demo-guide.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let ok=false;
          for(let i=0;i<50;i++){
            try{
              const a=await fetch(asset+'?wait='+Date.now(),{cache:'no-store'}).then(r=>r.text());
              const g=await fetch(guide+'?wait='+Date.now(),{cache:'no-store'}).then(r=>r.text());
              if(a.includes(marker)&&g.includes('CARETAXI-R3-20260827')){ok=true;break;}
            }catch{}
            await sleep(6000);
          }
          if(!ok) throw new Error('GitHub Pages did not expose R3 marker');
          JS

      - name: Run fresh browser R3 QA
        shell: bash
        run: |
          cat > caretaxi-tutorial-r3-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/';
          const STATE='dpro_caretaxi_tutorial_first10_v1';
          const out='CARETAXI_TUTORIAL_R3_QA'; fs.mkdirSync(out,{recursive:true});
          const results=[];
          const browser=await chromium.launch({headless:true});
          const add=(name,pass,detail={})=>results.push({name,pass,...detail});
          async function ctx(width,height){return browser.newContext({viewport:{width,height},locale:'ja-JP',timezoneId:'Asia/Tokyo',colorScheme:'light'});}
          async function openAt(page,step,width,height){
            const c=await ctx(width,height),p=await c.newPage();
            const consoleErrors=[],pageErrors=[]; p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});p.on('pageerror',e=>pageErrors.push(String(e)));
            await p.addInitScript(([key,step])=>localStorage.setItem(key,JSON.stringify({tutorialId:'CARETAXI_FIRST10_V1',version:1,currentStep:step,status:'active',completedSteps:[],skippedSteps:[],updatedAt:Date.now()})),[STATE,step]);
            const r=await p.goto(BASE+page+(page.includes('?')?'&':'?')+'tutorial=1&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await p.locator('#dpro-tutorial-card[data-open="1"]').waitFor({timeout:15000}); await p.waitForTimeout(250);
            return {c,p,status:r?.status()||0,consoleErrors,pageErrors};
          }
          for(const [label,w,h,step,page] of [['desktop',1440,900,1,'demo-guide.html'],['mobile390',390,844,2,'index.html'],['mobile320',320,720,2,'index.html'],['ipad',1024,900,8,'owner-ipad.html?demo=1']]){
            const x=await openAt(page,step,w,h); const m=await x.p.evaluate(()=>({iw:innerWidth,cw:document.documentElement.clientWidth,sw:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),card:document.querySelector('#dpro-tutorial-card')?.getBoundingClientRect().toJSON(),highlightPE:getComputedStyle(document.querySelector('#dpro-tutorial-highlight')).pointerEvents,targetInside:!!document.querySelector('#dpro-tutorial-card')?.contains(document.querySelector('#dpro-tutorial-highlight'))}));
            add(label,x.status<400&&m.sw===m.cw&&x.pageErrors.length===0&&x.consoleErrors.length===0&&m.highlightPE==='none'&&!m.targetInside,{status:x.status,metrics:m,consoleErrors:x.consoleErrors,pageErrors:x.pageErrors}); await x.c.close();
          }
          {
            const x=await openAt('index.html',2,390,844),p=x.p;
            const handle=p.locator('#dpro-tutorial-drag-handle'),before=await p.locator('#dpro-tutorial-card').boundingBox(),hb=await handle.boundingBox();
            await p.mouse.move(hb.x+20,hb.y+20);await p.mouse.down();await p.mouse.move(hb.x-70,hb.y-80,{steps:8});await p.mouse.up();const after=await p.locator('#dpro-tutorial-card').boundingBox();
            const v=await p.evaluate(()=>({w:visualViewport?.width||innerWidth,h:visualViewport?.height||innerHeight}));
            add('pointer_drag',(Math.abs(after.x-before.x)>20||Math.abs(after.y-before.y)>20)&&after.x>=0&&after.y>=0&&after.x+after.width<=v.w+1&&after.y+after.height<=v.h+1,{before,after,v});
            await handle.focus();const kb0=await p.locator('#dpro-tutorial-card').boundingBox();await p.keyboard.press('ArrowUp');const kb1=await p.locator('#dpro-tutorial-card').boundingBox();add('keyboard_drag',kb1.y<kb0.y,{kb0,kb1});
            const btn=p.locator('.dpro-tutorial-next'),bb=await btn.boundingBox(),c0=await p.locator('#dpro-tutorial-card').boundingBox();await p.mouse.move(bb.x+bb.width/2,bb.y+bb.height/2);await p.mouse.down();await p.mouse.move(bb.x-50,bb.y-50);await p.mouse.up();await p.waitForTimeout(100);const c1=await p.locator('#dpro-tutorial-card').boundingBox();add('no_drag_from_button',Math.abs(c1.x-c0.x)<2&&Math.abs(c1.y-c0.y)<2,{c0,c1});
            await x.c.close();
          }
          {
            const x=await openAt('index.html',2,390,844),p=x.p;
            await p.locator('.dpro-tutorial-next').click(); let s=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE); add('next',s.currentStep===3,{state:s});
            await p.locator('.dpro-tutorial-back').click(); s=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE); add('back',s.currentStep===2,{state:s});
            await p.keyboard.press('Escape'); add('esc_close',await p.locator('#dpro-tutorial-card').getAttribute('data-open')==='0');
            await p.locator('#dpro-tutorial-launcher').click(); await p.locator('[data-tutorial-menu="resume"]').click(); add('resume',await p.locator('#dpro-tutorial-card').getAttribute('data-open')==='1');
            await p.locator('.dpro-tutorial-skip').click(); s=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE); add('skip',s.currentStep===3&&s.skippedSteps.includes(2),{state:s});
            await x.c.close();
          }
          {
            const c=await ctx(1024,800),p=await c.newPage();
            await p.goto(BASE+'demo-guide.html?qa='+Date.now(),{waitUntil:'domcontentloaded'}); await p.locator('#dpro-tutorial-launcher').waitFor(); await p.locator('#dpro-tutorial-launcher').click(); await p.locator('[data-tutorial-menu="replay"]').click(); await p.waitForTimeout(200); const s=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE);add('replay',s.currentStep===1&&s.status==='active',{state:s});await c.close();
          }
          {
            const c=await ctx(1024,800),p=await c.newPage();
            // Seed step 1 only once. page.addInitScript runs again after every navigation,
            // so a sessionStorage guard is required to avoid resetting cross-page progress.
            await p.addInitScript(k=>{
              const seed='dpro_caretaxi_tutorial_r3_qa_seed_v13';
              if(sessionStorage.getItem(seed)==='1') return;
              localStorage.setItem(k,JSON.stringify({tutorialId:'CARETAXI_FIRST10_V1',version:1,currentStep:1,status:'active',completedSteps:[],skippedSteps:[],updatedAt:Date.now()}));
              sessionStorage.setItem(seed,'1');
            },STATE);
            await p.goto(BASE+'demo-guide.html?tutorial=1&kbd='+Date.now(),{waitUntil:'domcontentloaded'});await p.locator('#dpro-tutorial-card[data-open="1"]').waitFor();
            const expectedPages={2:'index.html',3:'index.html',4:'index.html',5:'index.html',6:'owner.html',7:'owner.html',8:'owner-ipad.html',9:'billing.html',10:'ledger.html'};
            try{
              for(let expected=2;expected<=10;expected++){
                const targetPage=expectedPages[expected];
                const currentPage=(new URL(p.url()).pathname.split('/').pop()||'index.html').toLowerCase();
                await p.locator('.dpro-tutorial-next').focus();
                if(currentPage!==targetPage){
                  await Promise.all([
                    p.waitForURL(url=>(url.pathname.split('/').pop()||'index.html').toLowerCase()===targetPage,{timeout:15000}),
                    p.keyboard.press('Enter')
                  ]);
                  await p.waitForLoadState('domcontentloaded');
                }else{
                  await p.keyboard.press('Enter');
                }
                await p.locator('#dpro-tutorial-card[data-open="1"]').waitFor({timeout:15000});
                const s=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE);
                if(s.currentStep!==expected) throw new Error(`keyboard flow expected ${expected}, got ${s.currentStep}`);
              }
              await p.locator('.dpro-tutorial-next').focus();await p.keyboard.press('Enter');await p.waitForTimeout(100);
              const end=await p.evaluate(k=>JSON.parse(localStorage.getItem(k)),STATE);
              add('keyboard_end_to_end',end.status==='completed'&&end.currentStep===10,{state:end});
              add('cross_page_resume',end.completedSteps.includes(1)&&end.completedSteps.includes(9),{state:end});
            }catch(e){
              const error=String(e);
              add('keyboard_end_to_end',false,{error});
              add('cross_page_resume',false,{error});
            }
            await c.close();
          }
          await browser.close();
          const ok=results.every(r=>r.pass); const report={ok,systemCode:'CARETAXI',phase:'R3',version:'V1.0',checkedAt:new Date().toISOString(),businessMutation:0,results};fs.writeFileSync(`${out}/R3_QA.json`,JSON.stringify(report,null,2));fs.writeFileSync(`${out}/R3_QA.txt`,results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}`).join('\n')+`\nOVERALL ${ok?'PASS':'FAIL'}\nBUSINESS_MUTATION 0\n`);console.log(fs.readFileSync(`${out}/R3_QA.txt`,'utf8'));if(!ok)process.exitCode=1;
          JS
          node caretaxi-tutorial-r3-qa.mjs

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caretaxi-tutorial-r3-qa
          path: CARETAXI_TUTORIAL_R3_QA/
          if-no-files-found: error
          retention-days: 30
