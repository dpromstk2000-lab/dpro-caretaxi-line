<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
<meta name="theme-color" content="#075d61">
  <title>DPRO介護タクシー｜iPad配車</title>
  <script src="config.js"></script>
  <style>
    :root{
      --main:#08676a;--deep:#064b50;--navy:#173d4d;--bg:#eaf2f3;--card:#fff;
      --line:#c8dadd;--muted:#61777c;--warn:#b87000;--danger:#bd3d36;
      --info:#246bb2;--ok:#17734a;--purple:#5f45a8;--shadow:0 8px 24px rgba(21,70,76,.11)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17383c;background:var(--bg);font-size:16px}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    .hidden{display:none!important}
    .top{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,var(--deep),var(--main));color:#fff;padding:12px 16px;box-shadow:0 3px 14px rgba(0,0,0,.16)}
    .top-inner{display:flex;gap:12px;align-items:center;justify-content:space-between}
    .brand small{display:block;font-size:11px;font-weight:900;letter-spacing:.14em}
    .brand h1{margin:1px 0 0;font-size:24px;line-height:1.2}
    .top-actions{display:flex;gap:8px;align-items:center}
    .top button,.top .pill{min-height:46px;border-radius:12px;font-weight:900}
    .top button{border:0;background:#fff;color:var(--deep);padding:0 15px}
    .top .pill{display:grid;place-items:center;border:1px solid rgba(255,255,255,.45);padding:0 14px}
    .shell{padding:12px 12px 24px}
    .datebar{display:grid;grid-template-columns:auto minmax(230px,1fr) auto auto;gap:8px;align-items:center;margin-bottom:10px}
    .datebar button,.datebar input{height:48px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;font-weight:900;color:var(--deep)}
    .datebar input{text-align:center}
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px;margin-bottom:10px}
    .metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
    .metric span{display:block;color:var(--muted);font-size:12px;font-weight:800}
    .metric strong{display:block;font-size:26px;color:var(--deep);line-height:1.1}
    .board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:9px;overflow-x:auto;padding-bottom:8px;min-height:calc(100vh - 210px);scroll-snap-type:x proximity}
    .lane{min-width:240px;background:#dfeaec;border:1px solid #bfd2d5;border-radius:15px;padding:8px;scroll-snap-align:start}
    .lane-head{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 9px}
    .lane-head h2{margin:0;font-size:16px}
    .count{display:grid;place-items:center;min-width:29px;height:29px;border-radius:999px;background:#fff;font-weight:900;color:var(--deep)}
    .cards{display:grid;gap:8px}
    .trip{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 4px 12px rgba(26,76,82,.08)}
    .trip.selected{outline:3px solid #47a0a5}
    .trip-top{display:flex;gap:7px;align-items:flex-start;justify-content:space-between}
    .trip-time{font-weight:950;font-size:20px;color:var(--deep)}
    .trip-no{font-size:11px;color:var(--muted);font-weight:800}
    .status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;white-space:nowrap}
    .s-pending{background:#fff0ca;color:#855600}.s-unassigned{background:#ffe3dd;color:#a03b2f}.s-assigned{background:#e3efff;color:#215da1}.s-operating{background:#ece5ff;color:#5c3aa5}.s-return{background:#ffe9cc;color:#8a5400}.s-done{background:#dff5e8;color:#176941}
    .passenger{margin-top:7px;font-size:18px;font-weight:950}
    .route{margin-top:7px;background:#f2f7f8;border-radius:10px;padding:8px;font-size:13px;font-weight:800}
    .route .arrow{color:var(--main);padding:0 4px}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
    .meta div{background:#f7fafb;border-radius:8px;padding:6px;font-size:12px}
    .meta span{display:block;color:var(--muted);font-size:10px;font-weight:800}
    .trip-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
    .btn{min-height:44px;border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px;font-weight:900;padding:7px}
    .btn-primary{background:var(--main);border-color:var(--main);color:#fff}
    .btn-warn{background:#fff8e7;border-color:#e2b967;color:#845000}
    .btn-danger{background:#fff4f3;border-color:#eab5b1;color:#aa332d}
    .empty{padding:28px 8px;text-align:center;color:var(--muted);font-weight:800}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#e7f1f2,#d3e6e8)}
    .login-card{width:min(520px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px rgba(5,75,80,.2)}
    .login-card h1{margin:3px 0 5px}.login-card p{color:var(--muted)}
    .field{display:grid;gap:6px;margin:11px 0}
    .field label{font-weight:900;font-size:13px}
    .field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid #b8cfd2;border-radius:11px;background:#fff;padding:10px 12px}
    .field textarea{min-height:80px;resize:vertical}
    .code{display:flex;gap:8px}.code input{flex:1}.code button{width:52px;border:1px solid var(--line);border-radius:11px;background:#eef5f6;font-size:22px}
    .login-card .btn-primary{width:100%;min-height:52px}
    .error{border:1px solid #edb4b0;background:#fff0ef;color:#a52d28;padding:10px;border-radius:10px;margin:10px 0}
    .detail{position:fixed;inset:0;z-index:70;display:none}
    .detail.open{display:block}
    .backdrop{position:absolute;inset:0;background:rgba(8,38,42,.48)}
    .sheet{position:absolute;right:0;top:0;bottom:0;width:min(620px,92vw);overflow:auto;background:#f4f9fa;box-shadow:-18px 0 50px rgba(0,0,0,.24)}
    .sheet-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:13px 15px}
    .sheet-head h2{margin:0;font-size:21px}.close{width:46px;height:46px;border:0;border-radius:11px;background:#eaf2f3;font-size:24px}
    .sheet-body{padding:12px}
    .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
    .box h3{margin:0 0 8px;font-size:17px}
    .kv{display:grid;grid-template-columns:110px 1fr;gap:5px 8px;margin:0}.kv dt{color:var(--muted);font-weight:800}.kv dd{margin:0;font-weight:800;word-break:break-word}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}
    .checks{display:flex;gap:7px;flex-wrap:wrap}
    .check{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;font-weight:800}
    .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#153f43;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);display:none;font-weight:800}
    .toast.show{display:block}.toast.bad{background:#a83731}
    @media(max-width:1080px){
      .metrics{grid-template-columns:repeat(3,1fr)}
      .board{grid-template-columns:repeat(5,260px);min-height:calc(100vh - 275px)}
    }
    @media(max-width:700px){
      .brand h1{font-size:19px}.top .pill{display:none}.top button{padding:0 10px}
      .datebar{grid-template-columns:auto 1fr auto}.datebar .today{grid-column:1/-1}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .board{grid-template-columns:repeat(5,86vw)}
      .sheet{width:100vw}.grid2{grid-template-columns:1fr}.wide{grid-column:auto}
    }
  
/* CARETAXI-11 最終UI・アクセシビリティ調整 */
:focus-visible{outline:3px solid #f5a623!important;outline-offset:2px!important}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.62}
.date-control{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;min-width:230px;border:1px solid var(--line,#c7dadd);border-radius:10px;background:#fff;color:var(--deep,#064c51);font-weight:900;padding:0 44px 0 14px;overflow:hidden}
.date-control::after{content:"📅";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.date-control .date-display{pointer-events:none;white-space:nowrap}
.date-control input[type="date"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
@media(max-width:650px){.date-control{min-width:0;width:100%;font-size:14px;padding-left:10px;padding-right:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<div id="loginView" class="login">
  <form id="loginForm" class="login-card">
    <small><b>DPRO CARE TAXI</b></small>
    <h1>iPad配車画面</h1>
    <p>受付・配車・当日の運行状況を、タッチ操作で確認します。</p>
    <div id="loginError" class="error hidden" role="alert"></div>
    <div class="field">
      <label for="adminCode">管理コード</label>
      <div class="code">
        <input id="adminCode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="デモ：1234" required>
        <button id="clearCode" type="button" aria-label="管理コードを消す">×</button>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">配車画面を開く</button>
  </form>
</div>

<div id="appView" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand"><small>DPRO CARE TAXI</small><h1 id="orgName">介護タクシー｜iPad配車</h1></div>
      <div class="top-actions">
        <span id="envPill" class="pill">デモ環境</span>
        <button id="reloadBtn" type="button">最新情報</button>
        <button id="logoutBtn" type="button">ログアウト</button>
      </div>
    </div>
  </header>
  <main class="shell">
    <section class="datebar">
      <button id="prevDate" type="button">← 前日</button>
      <label class="date-control"><span id="dateDisplay" class="date-display">日付を選択</span><input id="targetDate" type="date" aria-label="表示日を選択"></label>
      <button id="nextDate" type="button">翌日 →</button>
      <button id="todayBtn" class="today" type="button">今日</button>
    </section>
    <section id="metrics" class="metrics"></section>
    <section id="board" class="board"></section>
  </main>
</div>

<div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
  <div class="backdrop" data-close="1"></div>
  <aside class="sheet">
    <div class="sheet-head"><h2 id="detailTitle">予約詳細</h2><button class="close" aria-label="閉じる" data-close="1" type="button">×</button></div>
    <div id="detailBody" class="sheet-body"></div>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(()=>{
"use strict";
const C=window.CARETAXI_CONFIG||{};
const API=String(C.API_BASE_URL||"").replace(/\/+$/,"");
const ORG=C.ORGANIZATION_CODE||"dpro_caretaxi_demo";
const SESSION_KEY=C.ADMIN_SESSION_KEY||"dpro_caretaxi_admin_session_v1";
const $=id=>document.getElementById(id);
let session=null,data={trips:[],counts:{},resources:{}},current=null;

const labels={
 requested:"受付",reviewing:"確認中",estimate_sent:"見積送付",customer_confirmation:"利用者確認",
 confirmed:"予約確定",assigned:"配車済み",ready:"出発準備",departed:"出発",
 arrived_pickup:"お迎え到着",passenger_onboard:"乗車",arrived_destination:"目的地到着",
 return_waiting:"帰り待ち",completed:"完了",cancelled:"取消",rejected:"対応不可"
};
const mobility={walking:"歩行",cane:"杖",walker:"歩行器",wheelchair:"車いす",reclining_wheelchair:"リクライニング車いす",stretcher:"ストレッチャー"};
const purpose={hospital:"通院",discharge:"退院",transfer:"転院",shopping:"買い物",ceremony:"冠婚葬祭",outing:"外出",other:"その他"};

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function saveSession(j){session={token:j.token,expires_at:Date.now()+Number(j.expires_in||900)*1000};sessionStorage.setItem(SESSION_KEY,JSON.stringify(session))}
function clearSession(){session=null;sessionStorage.removeItem(SESSION_KEY)}
function authHeaders(){return session?.token?{Authorization:`Bearer ${session.token}`}:{}} 
async function api(path,{method="GET",body}={}){
  const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...authHeaders()},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch{}
  if(r.status===401){clearSession();showLogin();throw new Error("セッションの有効期限が切れました。再度ログインしてください。")}if(!r.ok||j.ok===false)throw new Error(j.message||j.error?.message||`通信エラー (${r.status})`);
  return j;
}
function toast(msg,bad=false){const t=$("toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className="toast",2600)}
function dateText(v){if(!v)return"-";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}
function timeText(v){if(!v)return"--:--";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}
function yen(v){return v==null?"確認中":Number(v).toLocaleString("ja-JP")+"円"}
function tokyoDateValue(value=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(value)}
function dateDisplayText(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||"")))return"日付を選択";const [y,m,d]=value.split("-").map(Number);const weekday=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",weekday:"short"}).format(new Date(`${value}T12:00:00+09:00`));return `${y}年${m}月${d}日（${weekday}）`}
function syncDateDisplay(){const e=$("dateDisplay");if(e)e.textContent=dateDisplayText($("targetDate").value)}
function setTargetDate(value,reload=false){$("targetDate").value=value;syncDateDisplay();if(reload)load()}
function shiftTargetDate(days){const value=$("targetDate").value||tokyoDateValue();const [y,m,d]=value.split("-").map(Number);const shifted=new Date(Date.UTC(y,m-1,d+days,3,0,0));setTargetDate(tokyoDateValue(shifted),true)}
function localValue(v){if(!v)return"";const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(v)).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`}
function addDate(days){shiftTargetDate(days)}

function stage(t){
  if(["requested","reviewing","estimate_sent","customer_confirmation"].includes(t.status))return"pending";
  if(["confirmed","assigned"].includes(t.status)&&!t.vehicle_id)return"unassigned";
  if(["confirmed","assigned","ready"].includes(t.status))return"assigned";
  if(["departed","arrived_pickup","passenger_onboard","arrived_destination"].includes(t.status))return"operating";
  if(t.status==="return_waiting")return"return";
  return"done";
}
const lanes=[
  ["pending","要確認"],
  ["unassigned","未配車"],
  ["assigned","配車済み"],
  ["operating","運行中"],
  ["return","帰り待ち"]
];

function metricCards(){
  const c=data.counts||{};
  const items=[
    ["本日の送迎",c.today_trips||0],["未確認",c.pending_trips||0],["未配車",c.unassigned_trips||0],
    ["運行中",c.operating||0],["帰り待ち",c.return_waiting||0],["本日完了",c.completed_today||0]
  ];
  $("metrics").innerHTML=items.map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join("");
}
function card(t){
  const s=stage(t),assigned=t.vehicle_name||t.driver_name;
  return `<article class="trip ${current?.trip?.id===t.id?"selected":""}" data-trip="${t.id}">
    <div class="trip-top"><div><div class="trip-time">${esc(timeText(t.requested_pickup_at))}</div><div class="trip-no">${esc(t.trip_no)}</div></div><span class="status s-${s}">${esc(labels[t.status]||t.status)}</span></div>
    <div class="passenger">${esc(t.passenger_name)}</div>
    <div class="route">${esc(t.pickup_place_name||"お迎え先未入力")}<span class="arrow">→</span>${esc(t.destination_place_name||"目的地未入力")}</div>
    <div class="meta"><div><span>移動方法</span>${esc(mobility[t.mobility_type]||t.mobility_type||"-")}</div><div><span>配車</span>${esc(assigned?`${t.vehicle_name||"-"}／${t.driver_name||"-"}`:"未設定")}</div><div><span>予約経路</span>${esc(t.booking_source||"-")}</div><div><span>金額</span>${esc(yen(t.final_total_yen??t.estimated_total_yen))}</div></div>
    <div class="trip-actions"><button class="btn" data-open="${t.id}" type="button">詳細</button><button class="btn ${s==="unassigned"?"btn-warn":"btn-primary"}" data-dispatch="${t.id}" type="button">${s==="unassigned"?"配車する":"配車確認"}</button></div>
  </article>`;
}
function render(){
  metricCards();
  $("board").innerHTML=lanes.map(([key,title])=>{
    const items=(data.trips||[]).filter(t=>stage(t)===key);
    return `<section class="lane"><div class="lane-head"><h2>${title}</h2><span class="count">${items.length}</span></div><div class="cards">${items.map(card).join("")||'<div class="empty">該当なし</div>'}</div></section>`;
  }).join("");
  document.querySelectorAll("[data-open],[data-dispatch]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open||b.dataset.dispatch));
}
async function load(){
  try{
    data=await api("/v1/admin/dashboard",{method:"POST",body:{target_date:$("targetDate").value}});
    $("orgName").textContent=(data.organization?.name||"介護タクシー")+"｜iPad配車";
    $("envPill").textContent=data.organization?.is_demo?"デモ環境":"本番環境";
    render();
  }catch(e){
    if(/セッション|認証/.test(e.message)){clearSession();showLogin()}
    toast(e.message,true);
  }
}
function showLogin(){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden")}
function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}

async function openDetail(id){
  try{
    current=await api("/v1/admin/trip-detail",{method:"POST",body:{trip_id:id}});
    renderDetail();
    $("detail").classList.add("open");
    $("detail").setAttribute("aria-hidden","false");
    render();
  }catch(e){toast(e.message,true)}
}
function renderDetail(){
  const x=current,t=x.trip,p=x.passenger,c=x.customer||{},leg=(x.legs||[])[0]||{};
  const r=data.resources||{},drivers=(r.staff||[]).filter(s=>["driver","driver_caregiver","admin"].includes(s.role_type));
  const assistants=(r.staff||[]).filter(s=>["caregiver","driver_caregiver","admin"].includes(s.role_type));
  $("detailTitle").textContent=`${t.trip_no}｜${p.full_name}`;
  $("detailBody").innerHTML=`
    <div class="box"><h3>予約・送迎</h3><dl class="kv">
      <dt>状態</dt><dd>${esc(labels[t.status]||t.status)}</dd>
      <dt>お迎え</dt><dd>${esc(dateText(t.requested_pickup_at))}</dd>
      <dt>利用目的</dt><dd>${esc(purpose[t.service_purpose]||t.service_purpose||"-")}</dd>
      <dt>移動方法</dt><dd>${esc(mobility[t.mobility_type]||t.mobility_type||p.mobility_type||"-")}</dd>
      <dt>予約者</dt><dd>${esc(c.full_name||"-")} ${esc(c.phone||"")}</dd>
      <dt>乗車者</dt><dd>${esc(p.full_name||"-")} ${esc(p.phone||"")}</dd>
      <dt>お迎え先</dt><dd>${esc(leg.pickup_place_name||"")}<br>${esc(leg.pickup_address||"")}</dd>
      <dt>目的地</dt><dd>${esc(leg.destination_place_name||"")}<br>${esc(leg.destination_address||"")}</dd>
      <dt>介助</dt><dd>${esc(t.assistance_summary||"-")}</dd>
    </dl></div>
    <div class="box"><h3>受付操作</h3><div class="sheet-actions">
      <button id="reviewBtn" class="btn btn-warn" type="button">内容確認中</button>
      <button id="confirmBtn" class="btn btn-primary" type="button">予約を確定</button>
    </div></div>
    <div class="box"><h3>配車</h3><div class="grid2">
      <div class="field"><label>車両</label><select id="vehicleSelect"><option value="">選択</option>${(r.vehicles||[]).map(v=>`<option value="${v.id}" ${leg.vehicle_id===v.id?"selected":""}>${esc(v.name)}（${esc(v.vehicle_type)}）</option>`).join("")}</select></div>
      <div class="field"><label>運転者</label><select id="driverSelect"><option value="">選択</option>${drivers.map(s=>`<option value="${s.id}" ${leg.staff?.some(a=>a.id===s.id&&a.role==="driver")?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label>占有開始</label><input id="reservedFrom" type="datetime-local" value="${esc(leg.reserved_from?localValue(leg.reserved_from):leg.scheduled_pickup_at?localValue(new Date(new Date(leg.scheduled_pickup_at).getTime()-20*60000)):"")}"></div>
      <div class="field"><label>占有終了</label><input id="reservedUntil" type="datetime-local" value="${esc(leg.reserved_until?localValue(leg.reserved_until):leg.scheduled_pickup_at?localValue(new Date(new Date(leg.scheduled_pickup_at).getTime()+100*60000)):"")}"></div>
      <div class="field wide"><label>介助スタッフ</label><div class="checks">${assistants.map(s=>`<label class="check"><input type="checkbox" name="assistants" value="${s.id}" ${leg.staff?.some(a=>a.id===s.id&&a.role==="assistant")?"checked":""}>${esc(s.name)}</label>`).join("")||"登録なし"}</div></div>
      <div class="field wide"><label>福祉機器</label><div class="checks">${(r.equipment||[]).map(e=>`<label class="check"><input type="checkbox" name="equipment" value="${e.id}" ${leg.equipment?.some(a=>a.id===e.id)?"checked":""}>${esc(e.name)}</label>`).join("")||"登録なし"}</div></div>
      <button id="assignBtn" class="btn btn-primary wide" type="button" ${!leg.id?"disabled":""}>重複確認して配車を登録</button>
    </div></div>`;
  $("reviewBtn").onclick=()=>tripAction(t.id,"start_review",{});
  $("confirmBtn").onclick=()=>tripAction(t.id,"confirm",{});
  $("assignBtn").onclick=()=>assign(leg.id,t.id);
}
async function tripAction(tripId,action,payload){
  try{await api("/v1/admin/trip-action",{method:"POST",body:{trip_id:tripId,action,payload}});toast("更新しました");await load();await openDetail(tripId)}
  catch(e){toast(e.message,true)}
}
async function assign(legId,tripId){
  try{
    const assistants=[...document.querySelectorAll('input[name="assistants"]:checked')].map(x=>x.value);
    const equipment=[...document.querySelectorAll('input[name="equipment"]:checked')].map(x=>x.value);
    const from=$("reservedFrom").value,until=$("reservedUntil").value;
    if(!$("vehicleSelect").value||!$("driverSelect").value||!from||!until)throw new Error("車両・運転者・占有時間を入力してください。");
    await api("/v1/admin/assign",{method:"POST",body:{
      trip_leg_id:legId,vehicle_id:$("vehicleSelect").value,driver_staff_id:$("driverSelect").value,
      assistant_staff_ids:assistants,equipment_ids:equipment,
      reserved_from:new Date(from).toISOString(),reserved_until:new Date(until).toISOString()
    }});
    toast("配車を登録しました");await load();await openDetail(tripId);
  }catch(e){toast(e.message,true)}
}

$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("loginError").classList.add("hidden");
  try{
    const j=await api("/v1/auth/admin",{method:"POST",body:{code:$("adminCode").value,organization_code:ORG}});
    saveSession(j);showApp();await load();
  }catch(err){$("loginError").textContent=err.message;$("loginError").classList.remove("hidden")}
};
$("clearCode").onclick=()=>{$("adminCode").value="";$("adminCode").focus()};
$("reloadBtn").onclick=load;
$("logoutBtn").onclick=()=>{clearSession();showLogin()};
$("targetDate").onchange=()=>{syncDateDisplay();load()};
$("prevDate").onclick=()=>addDate(-1);
$("nextDate").onclick=()=>addDate(1);
$("todayBtn").onclick=()=>setTargetDate(tokyoDateValue(),true);
document.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>{$("detail").classList.remove("open");$("detail").setAttribute("aria-hidden","true");current=null;render()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("detail").classList.contains("open")){$("detail").classList.remove("open");$("detail").setAttribute("aria-hidden","true");current=null;render()}});

setTargetDate(tokyoDateValue());
try{
  const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");
  if(s?.token&&Number(s.expires_at||0)>Date.now()){session=s;showApp();load()}else{clearSession();showLogin()}
}catch{clearSession();showLogin()}
})();
</script>
</body>
</html>
