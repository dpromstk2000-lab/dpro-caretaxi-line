<!doctype html>

  <style>
    :root{--main:#08676a;--deep:#064b50;--navy:#163a4a;--bg:#eef5f6;--card:#fff;--line:#cddfe1;--muted:#60767b;--ok:#157a4c;--warn:#b86c00;--danger:#bd3d36;--info:#246bb2;--shadow:0 10px 30px rgba(26,76,82,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#17383c;font-size:16px;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .top{background:linear-gradient(120deg,var(--deep),var(--main));color:#fff;padding:18px 28px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12)}.top-inner{max-width:1500px;margin:auto;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand small{font-weight:800;letter-spacing:.14em}.brand h1{margin:2px 0 0;font-size:28px;line-height:1.25}.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 12px;font-weight:700}.top button{background:#fff;color:var(--deep);border:0;border-radius:10px;padding:10px 15px;font-weight:800}

    .toolbar{margin:16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar button,.btn{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px;padding:11px 16px;font-weight:800}.toolbar button.active,.btn-primary{background:var(--main);border-color:var(--main);color:#fff}.btn-danger{color:var(--danger);border-color:#efbbb7;background:#fff7f6}.btn-warn{color:#815000;border-color:#e6bd74;background:#fff8e8}.btn-small{padding:7px 11px;font-size:14px}.toolbar .spacer{flex:1}.toolbar input[type=date]{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center}.panel-head h2{margin:0;font-size:20px}.table-wrap{overflow:auto;max-height:62vh}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:11px 12px;border-bottom:1px solid #e6eeee;text-align:left;vertical-align:middle}th{background:#f6fafb;position:sticky;top:0;z-index:2;font-size:13px;color:#4d686c}tr:hover td{background:#f7fbfb}.status{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;white-space:nowrap}.s-requested,.s-reviewing{background:#fff0cc;color:#845700}.s-estimate_sent,.s-customer_confirmation{background:#e6f1ff;color:#175c99}.s-confirmed,.s-assigned,.s-ready{background:#e5f1ff;color:#1d58a5}.s-departed,.s-arrived_pickup,.s-passenger_onboard,.s-arrived_destination,.s-return_waiting{background:#eee8ff;color:#5c3aaa}.s-completed{background:#def5e8;color:#136a40}.s-cancelled,.s-rejected{background:#fde6e4;color:#a3312c}.source{font-size:12px;color:var(--muted)}.route{max-width:260px}.route b{display:block}.route small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,#eaf4f5,#d6e9eb)}.login-card{width:min(520px,100%);background:#fff;padding:28px;border-radius:20px;box-shadow:0 24px 70px rgba(5,75,80,.18)}.login-card h1{margin:4px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:800;font-size:14px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #b9d0d3;border-radius:10px;background:#fff}.field textarea{min-height:85px;resize:vertical}.code-wrap{display:flex;gap:8px}.code-wrap input{flex:1}.clear-btn{width:48px;border:1px solid var(--line);background:#f4f8f8;border-radius:10px;font-size:22px}.login-card .btn-primary{width:100%;padding:13px;border-radius:11px;font-weight:900;border:0}.error{background:#fff0ef;color:#a52c27;border:1px solid #efb5b1;padding:10px 12px;border-radius:10px;margin:10px 0}.muted{color:var(--muted)}
    .drawer{position:fixed;inset:0;z-index:80;display:none}.drawer.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(7,38,42,.48)}.drawer-card{position:absolute;right:0;top:0;bottom:0;width:min(760px,96vw);background:#f5fafb;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.22)}.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}.drawer-head h2{margin:0}.close{border:0;background:#edf4f5;border-radius:10px;width:42px;height:42px;font-size:23px}.drawer-body{padding:16px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.box h3{margin:0 0 10px;font-size:17px}.kv{display:grid;grid-template-columns:135px 1fr;gap:5px 10px}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;font-weight:700;word-break:break-word}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action-grid .wide{grid-column:1/-1}.checks{display:flex;gap:9px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}.section-title{font-size:18px;margin:18px 0 9px}.request-card{border:1px solid #edcf98;background:#fffaf0;border-radius:12px;padding:12px;margin:8px 0}.request-card b{display:block}.empty{padding:35px;text-align:center;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(7,38,42,.5);z-index:90;display:none;place-items:center;padding:18px}.modal.open{display:grid}.modal-card{background:#fff;width:min(880px,96vw);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modal-body{padding:17px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.form-grid .wide{grid-column:1/-1}.search-results{display:grid;gap:8px;max-height:250px;overflow:auto;margin:8px 0}.search-item{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:left}.search-item:hover{border-color:var(--main)}
    .toast{position:fixed;right:18px;bottom:20px;z-index:120;background:#153f43;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);max-width:420px;display:none}.toast.show{display:block}.toast.bad{background:#a83731}
    @media(max-width:1150px){.dashboard{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){body{font-size:15px}.top{position:static;padding:14px}.top-inner{align-items:flex-start}.brand h1{font-size:22px}.shell{padding:12px 10px 86px}.dashboard{grid-template-columns:repeat(2,1fr)}.toolbar .spacer{display:none}.panel-head{align-items:flex-start}.detail-grid,.action-grid,.form-grid{grid-template-columns:1fr}.action-grid .wide,.form-grid .wide{grid-column:auto}.drawer-card{width:100vw}.kv{grid-template-columns:105px 1fr}.top-actions .pill{display:none}}
  
/* CARETAXI-11 最終UI・アクセシビリティ調整 */
:focus-visible{outline:3px solid #f5a623!important;outline-offset:2px!important}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.62}
.date-control{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;min-width:230px;border:1px solid var(--line,#c7dadd);border-radius:10px;background:#fff;color:var(--deep,#064c51);font-weight:900;padding:0 44px 0 14px;overflow:hidden}
.date-control::after{content:"📅";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.date-control .date-display{pointer-events:none;white-space:nowrap}
.date-control input[type="date"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
@media(max-width:650px){.date-control{min-width:0;width:100%;font-size:14px;padding-left:10px;padding-right:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>

<body class="operation-demo-page">
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="muted"><b>DPRO CARE TAXI / OPERATION DEMO</b></div><h1>管理者PC 操作デモ</h1><p class="muted">電話受付・見積・予約確定・配車・当日の状況を管理します。</p>
    <div id="loginError" class="error hidden" role="alert"></div>
    <div class="field"><label for="adminCode">管理コード</label><div class="code-wrap"><input id="adminCode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="デモ：1234" required><button id="clearCode" class="clear-btn" type="button" aria-label="管理コードを消去">×</button></div></div>
    <button class="btn-primary" type="submit">管理画面を開く</button><a class="official-demo-link" href="https://dpro-shop.com/systems/caretaxi">公式の機能説明を見る</a><p class="muted">公開デモは架空情報を使用します。実在する個人情報は入力しないでください。</p>
  </form>
</div>
<div id="appView" class="hidden">
  <header class="top"><div class="top-inner"><div class="brand"><small>DPRO CARE TAXI</small><h1 id="orgName">介護タクシー 管理者PC</h1></div><div class="top-actions"><span id="envPill" class="pill">デモ環境</span><button id="phoneOpen">＋ 電話受付</button><a class="official-demo-link" href="https://dpro-shop.com/systems/caretaxi">公式説明</a><button id="ledgerOpen">顧客台帳</button><button id="billingOpen">￥ 料金管理</button><button id="reloadBtn">最新情報</button><button id="logoutBtn">ログアウト</button></div></div></header>
  <main class="shell"><div id="demoAlert" class="alert">公開操作デモです。表示される氏名・住所・予約はすべて架空情報です。</div>
    <section id="metrics" class="dashboard"></section>
    <div class="toolbar"><button class="active" data-filter="all">すべて</button><button data-filter="pending">未確認</button><button data-filter="today">本日</button><button data-filter="unassigned">未配車</button><button data-filter="return_waiting">帰り連絡待ち</button><button data-filter="member_request">会員申請あり</button><span class="spacer"></span><label class="date-control"><span id="dateDisplay" class="date-display">日付を選択</span><input id="targetDate" type="date" aria-label="表示日を選択"></label><button id="customerOpen">顧客検索</button></div>
    <section class="panel"><div class="panel-head"><div><h2>送迎予約・当日運行</h2><div id="listSummary" class="muted"></div></div></div><div class="table-wrap"><table><thead><tr><th>日時・受付</th><th>利用者</th><th>送迎区間</th><th>状態</th><th>配車</th><th>金額</th><th>操作</th></tr></thead><tbody id="tripRows"></tbody></table><div id="emptyList" class="empty hidden">該当する送迎はありません。</div></div></section>
  </main>
</div>

<div id="tripDrawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"><div class="backdrop" data-close="drawer"></div><div class="drawer-card"><div class="drawer-head"><h2 id="drawerTitle">送迎詳細</h2><button class="close" aria-label="閉じる" data-close="drawer">×</button></div><div id="drawerBody" class="drawer-body"></div></div></div>
<div id="phoneModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="phoneModalTitle" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2 id="phoneModalTitle">電話受付</h2><button class="close" aria-label="閉じる" data-close="phone">×</button></div><form id="phoneForm" class="modal-body"><div class="field"><label>既存顧客を検索</label><div class="code-wrap"><input id="phoneSearch" placeholder="氏名・電話番号・顧客番号"><button id="phoneSearchBtn" type="button" class="btn">検索</button></div><div id="phoneSearchResults" class="search-results"></div></div><div class="form-grid">
  <input id="selectedCustomerId" type="hidden"><input id="selectedPassengerId" type="hidden">
  <div class="field"><label>予約者名 *</label><input id="pcCustomerName" required></div><div class="field"><label>電話番号 *</label><input id="pcCustomerPhone" inputmode="tel" required></div>
  <div class="field"><label>乗車者名 *</label><input id="pcPassengerName" required></div><div class="field"><label>移動方法</label><select id="pcMobility"><option value="walking">歩行</option><option value="cane">杖</option><option value="walker">歩行器</option><option value="wheelchair">車いす</option><option value="reclining_wheelchair">リクライニング車いす</option><option value="stretcher">ストレッチャー</option></select></div>

  <div class="field wide"><label>介助・連絡事項</label><textarea id="pcNotes"></textarea></div></div><div id="phoneError" class="error hidden" role="alert"></div><button class="btn btn-primary" type="submit">電話受付を登録</button></form></div></div>
<div id="customerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2 id="customerModalTitle">顧客・利用者検索</h2><button class="close" aria-label="閉じる" data-close="customer">×</button></div><div class="modal-body"><div class="code-wrap"><input id="customerQuery" placeholder="氏名・電話番号・顧客番号・利用者名"><button id="customerSearchBtn" class="btn btn-primary">検索</button></div><div id="customerResults" class="search-results"></div></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
(()=>{"use strict";
const C=window.CARETAXI_CONFIG||{};const API=(C.API_BASE_URL||"").replace(/\/$/,"");const ORG=C.ORGANIZATION_CODE||"dpro_caretaxi_demo";const SESSION_KEY=C.ADMIN_SESSION_KEY||"dpro_caretaxi_admin_session_v1";
const $=id=>document.getElementById(id);let session=null,data=null,filter="all",currentTrip=null;
const labels={requested:"受付",reviewing:"内容確認中",estimate_sent:"見積送付済み",customer_confirmation:"利用者確認待ち",confirmed:"予約確定",assigned:"配車済み",ready:"出発準備",departed:"出発",arrived_pickup:"お迎え先到着",passenger_onboard:"乗車",arrived_destination:"目的地到着",return_waiting:"帰り連絡待ち",completed:"完了",cancelled:"キャンセル",rejected:"対応不可"};
const purpose={hospital_visit:"通院",hospital_discharge:"退院",hospital_transfer:"転院",shopping:"買い物",ceremony:"冠婚葬祭",leisure:"外出",facility_transfer:"施設間移動",other:"その他"};
const mobility={walking:"歩行",cane:"杖",walker:"歩行器",wheelchair:"車いす",reclining_wheelchair:"リクライニング車いす",stretcher:"ストレッチャー",other:"その他"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function tokyoDateValue(value=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(value)}
function dateDisplayText(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||"")))return"日付を選択";const [y,m,d]=value.split("-").map(Number);const weekday=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",weekday:"short"}).format(new Date(`${value}T12:00:00+09:00`));return `${y}年${m}月${d}日（${weekday}）`}
function syncDateDisplay(){const e=$("dateDisplay");if(e)e.textContent=dateDisplayText($("targetDate").value)}
function setTargetDate(value,reload=false){$("targetDate").value=value;syncDateDisplay();if(reload)load()}
function shiftTargetDate(days){const value=$("targetDate").value||tokyoDateValue();const [y,m,d]=value.split("-").map(Number);const shifted=new Date(Date.UTC(y,m-1,d+days,3,0,0));setTargetDate(tokyoDateValue(shifted),true)}
function yen(v){return v==null?"確認中":Number(v).toLocaleString("ja-JP")+"円"}function dt(v){if(!v)return"未設定";return new Intl.DateTimeFormat("ja-JP",{month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}function isoLocal(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}
function toast(msg,bad=false){const e=$("toast");e.textContent=msg;e.className="toast show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="toast",3600)}
async function api(path,{method="GET",body,auth=true,idem}={}){const h={"Content-Type":"application/json"};if(auth&&session?.token)h.Authorization=`Bearer ${session.token}`;if(idem)h["Idempotency-Key"]=idem;const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(r.status===401&&auth){clearSession();openLogin();throw new Error("セッションの有効期限が切れました。再度ログインしてください。")}if(!r.ok||j.ok===false)throw new Error(j.message||j.error?.message||`通信エラー (${r.status})`);return j}
function saveSession(s){session=s;sessionStorage.setItem(SESSION_KEY,JSON.stringify(s))}function clearSession(){session=null;sessionStorage.removeItem(SESSION_KEY)}
$("clearCode").onclick=()=>{$("adminCode").value="";$("adminCode").focus()};$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").classList.add("hidden");try{const j=await api("/v1/auth/admin",{method:"POST",auth:false,body:{code:$("adminCode").value,organization_code:ORG}});saveSession(j);openApp();await load()}catch(err){$("loginError").textContent=err.message;$("loginError").classList.remove("hidden")}};
function openApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}function openLogin(){$("appView").classList.add("hidden");$("loginView").classList.remove("hidden")}
async function load(){try{data=await api("/v1/admin/dashboard",{method:"POST",body:{target_date:$("targetDate").value||undefined}});$("orgName").textContent=data.organization.name+"｜管理者PC";$("envPill").textContent=data.organization.is_demo?"デモ環境":"本番環境";renderMetrics();renderTrips()}catch(e){if(/セッション/.test(e.message)){clearSession();openLogin()}toast(e.message,true)}}
function renderMetrics(){const c=data.counts||{};const items=[["本日の送迎",c.today_trips],["未確認",c.pending_trips],["未配車",c.unassigned_trips],["帰り待ち",c.return_waiting],["運行中",c.operating],["本日完了",c.completed_today],["会員申請",c.pending_member_requests],["未払い",c.unpaid]];$("metrics").innerHTML=items.map(([n,v])=>`<div class="metric"><span>${esc(n)}</span><strong>${Number(v||0)}</strong></div>`).join("")}
function filtered(){return(data?.trips||[]).filter(t=>{if(filter==="pending")return["requested","reviewing","estimate_sent","customer_confirmation"].includes(t.status);if(filter==="today"){const d=new Date(t.requested_pickup_at);return tokyoDateValue(d)===($("targetDate").value||tokyoDateValue())}if(filter==="unassigned")return["confirmed","assigned"].includes(t.status)&&!t.vehicle_id;if(filter==="return_waiting")return t.status==="return_waiting";if(filter==="member_request")return t.has_pending_request;return true})}
function renderTrips(){const list=filtered();$("listSummary").textContent=`${list.length}件を表示（全${data?.trips?.length||0}件）`;$("emptyList").classList.toggle("hidden",list.length>0);$("tripRows").innerHTML=list.map(t=>`<tr><td><b>${esc(dt(t.requested_pickup_at))}</b><div class="source">${esc(t.trip_no)}｜${esc(t.booking_source||"")}</div></td><td><b>${esc(t.passenger_name)}</b><div class="source">予約者：${esc(t.customer_name||"未登録")} ${esc(t.customer_phone||"")}</div></td><td class="route"><b>${esc(t.pickup_place_name||"お迎え先")} → ${esc(t.destination_place_name||"目的地")}</b><small>${esc(t.pickup_address)} → ${esc(t.destination_address)}</small></td><td><span class="status s-${esc(t.status)}">${esc(labels[t.status]||t.status)}</span>${t.has_pending_request?'<div class="source">申請あり</div>':''}</td><td>${t.vehicle_name?`<b>${esc(t.vehicle_name)}</b><div class="source">${esc(t.driver_name||"運転者未設定")}</div>`:'<span class="status s-requested">未配車</span>'}</td><td>${esc(yen(t.final_total_yen??t.estimated_total_yen))}</td><td><div class="row-actions"><button class="btn btn-small" data-detail="${t.id}">詳細</button>${t.status==="requested"?`<button class="btn btn-small btn-warn" data-quick="review" data-id="${t.id}">確認開始</button>`:""}</div></td></tr>`).join("");document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>openTrip(b.dataset.detail));document.querySelectorAll('[data-quick="review"]').forEach(b=>b.onclick=()=>action(b.dataset.id,"start_review",{}))}
async function action(tripId,act,payload){try{await api("/v1/admin/trip-action",{method:"POST",body:{trip_id:tripId,action:act,payload}});toast("更新しました");await load();if(currentTrip?.trip?.id===tripId)await openTrip(tripId)}catch(e){toast(e.message,true)}}
async function openTrip(id){try{currentTrip=await api("/v1/admin/trip-detail",{method:"POST",body:{trip_id:id}});renderDrawer();$("tripDrawer").classList.add("open");$("tripDrawer").setAttribute("aria-hidden","false")}catch(e){toast(e.message,true)}}
function renderDrawer(){const x=currentTrip,t=x.trip,p=x.passenger,c=x.customer||{},leg=(x.legs||[])[0]||{},r=data.resources||{};const assistants=(r.staff||[]).filter(s=>["caregiver","driver_caregiver","admin"].includes(s.role_type));const drivers=(r.staff||[]).filter(s=>["driver","driver_caregiver","admin"].includes(s.role_type));$("drawerTitle").textContent=`${t.trip_no}｜${p.full_name}`;$("drawerBody").innerHTML=`
<div class="detail-grid"><div class="box"><h3>予約・利用者</h3><dl class="kv"><dt>状態</dt><dd><span class="status s-${esc(t.status)}">${esc(labels[t.status]||t.status)}</span></dd><dt>お迎え</dt><dd>${esc(dt(t.requested_pickup_at))}</dd><dt>利用目的</dt><dd>${esc(purpose[t.service_purpose]||t.service_purpose)}</dd><dt>移動方法</dt><dd>${esc(mobility[t.mobility_type]||t.mobility_type||p.mobility_type)}</dd><dt>予約者</dt><dd>${esc(c.full_name||"-")} ${esc(c.phone||"")}</dd><dt>乗車者</dt><dd>${esc(p.full_name)} ${esc(p.phone||"")}</dd></dl></div><div class="box"><h3>送迎区間</h3><dl class="kv"><dt>お迎え先</dt><dd>${esc(leg.pickup_place_name||"")}<br>${esc(leg.pickup_address||"")}</dd><dt>目的地</dt><dd>${esc(leg.destination_place_name||"")}<br>${esc(leg.destination_address||"")}</dd><dt>介助</dt><dd>${esc(t.assistance_summary||"-")}</dd><dt>利用者連絡</dt><dd>${esc(t.customer_notes||"-")}</dd><dt>内部メモ</dt><dd>${esc(t.internal_notes||"-")}</dd></dl></div></div>
<h3 class="section-title">受付・見積・予約確定</h3><div class="box action-grid"><button id="reviewAction" class="btn btn-warn">内容確認中にする</button><button id="confirmAction" class="btn btn-primary">予約を確定</button><div class="field"><label>見積金額</label><input id="estimateYen" type="number" min="0" value="${t.estimated_total_yen??""}" placeholder="例：6500"></div><div class="field"><label>お客様への見積メッセージ</label><input id="estimateMessage" value="${esc((x.estimates||[])[0]?.customer_message||"")}" placeholder="概算見積です"></div><button id="estimateAction" class="btn btn-primary wide">見積を保存・送付済みにする</button><div class="field wide"><label>内部メモ</label><textarea id="internalNotes">${esc(t.internal_notes||"")}</textarea></div><button id="notesAction" class="btn wide">内部メモを保存</button><div class="field wide"><label>キャンセル理由</label><input id="cancelReason" placeholder="理由を入力"></div><button id="cancelAction" class="btn btn-danger wide">予約をキャンセル</button></div>
<h3 class="section-title">配車</h3><div class="box form-grid"><div class="field"><label>車両</label><select id="assignVehicle"><option value="">選択</option>${(r.vehicles||[]).map(v=>`<option value="${v.id}" ${leg.vehicle_id===v.id?"selected":""}>${esc(v.name)}（${esc(v.vehicle_type)}）</option>`).join("")}</select></div><div class="field"><label>運転者</label><select id="assignDriver"><option value="">選択</option>${drivers.map(s=>`<option value="${s.id}" ${leg.staff?.some(a=>a.id===s.id&&a.role==="driver")?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>占有開始</label><input id="reservedFrom" type="datetime-local" value="${leg.reserved_from?isoLocal(new Date(leg.reserved_from)):leg.scheduled_pickup_at?isoLocal(new Date(new Date(leg.scheduled_pickup_at).getTime()-20*60000)):""}"></div><div class="field"><label>占有終了</label><input id="reservedUntil" type="datetime-local" value="${leg.reserved_until?isoLocal(new Date(leg.reserved_until)):leg.scheduled_pickup_at?isoLocal(new Date(new Date(leg.scheduled_pickup_at).getTime()+100*60000)):""}"></div><div class="field wide"><label>介助スタッフ</label><div class="checks">${assistants.map(s=>`<label class="check"><input type="checkbox" name="assistants" value="${s.id}" ${leg.staff?.some(a=>a.id===s.id&&a.role==="assistant")?"checked":""}>${esc(s.name)}</label>`).join("")||"登録なし"}</div></div><div class="field wide"><label>福祉機器</label><div class="checks">${(r.equipment||[]).map(e=>`<label class="check"><input type="checkbox" name="equipment" value="${e.id}" ${leg.equipment?.some(a=>a.id===e.id)?"checked":""}>${esc(e.name)}</label>`).join("")||"登録なし"}</div></div><button id="assignAction" class="btn btn-primary wide" ${!leg.id?"disabled":""}>重複確認して配車を登録</button></div>
${(x.member_requests||[]).length?`<h3 class="section-title">会員・家族からの申請</h3>${x.member_requests.map(q=>`<div class="request-card"><b>${esc(q.request_type)}｜${esc(q.status)}</b><div>${esc(q.request_message||"内容なし")}</div>${["pending","reviewing"].includes(q.status)?`<div class="row-actions"><button class="btn btn-small" data-request="${q.id}" data-resolution="completed">対応完了</button><button class="btn btn-small btn-danger" data-request="${q.id}" data-resolution="rejected">却下</button></div>`:""}</div>`).join("")}`:""}`;
$("reviewAction").onclick=()=>action(t.id,"start_review",{});$("confirmAction").onclick=()=>action(t.id,"confirm",{});$("estimateAction").onclick=()=>action(t.id,"save_estimate",{total_yen:Number($("estimateYen").value),customer_message:$("estimateMessage").value});$("notesAction").onclick=()=>action(t.id,"save_notes",{internal_notes:$("internalNotes").value});$("cancelAction").onclick=()=>{if(confirm("この予約をキャンセルしますか？"))action(t.id,"cancel",{reason:$("cancelReason").value})};$("assignAction").onclick=()=>assign(leg.id);document.querySelectorAll("[data-request]").forEach(b=>b.onclick=()=>action(t.id,"handle_member_request",{request_id:b.dataset.request,status:b.dataset.resolution}))}
async function assign(legId){try{const assistants=[...document.querySelectorAll('input[name="assistants"]:checked')].map(x=>x.value);const equipment=[...document.querySelectorAll('input[name="equipment"]:checked')].map(x=>x.value);await api("/v1/admin/assign",{method:"POST",body:{trip_leg_id:legId,vehicle_id:$("assignVehicle").value,driver_staff_id:$("assignDriver").value,assistant_staff_ids:assistants,equipment_ids:equipment,reserved_from:new Date($("reservedFrom").value).toISOString(),reserved_until:new Date($("reservedUntil").value).toISOString()}});toast("配車を登録しました");await load();await openTrip(currentTrip.trip.id)}catch(e){toast(e.message,true)}}
function close(kind){const id=kind==="drawer"?"tripDrawer":kind==="phone"?"phoneModal":"customerModal";$(id).classList.remove("open");$(id).setAttribute("aria-hidden","true")}document.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>close(e.dataset.close));document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;["tripDrawer","phoneModal","customerModal"].forEach(id=>{$(id).classList.remove("open");$(id).setAttribute("aria-hidden","true")})});
$("ledgerOpen").onclick=()=>location.href="./ledger.html";$("billingOpen").onclick=()=>location.href="./billing.html";$("phoneOpen").onclick=()=>{$("phoneForm").reset();$("selectedCustomerId").value="";$("selectedPassengerId").value="";$("phoneSearchResults").innerHTML="";const d=new Date(Date.now()+24*3600e3);d.setMinutes(Math.ceil(d.getMinutes()/30)*30,0,0);$("pcPickupAt").value=isoLocal(d);$("phoneModal").classList.add("open");$("phoneModal").setAttribute("aria-hidden","false")};$("customerOpen").onclick=()=>{$("customerModal").classList.add("open");$("customerModal").setAttribute("aria-hidden","false")};
async function search(q,target,selectable){try{const j=await api("/v1/admin/customer-search",{method:"POST",body:{query:q}});target.innerHTML=(j.items||[]).map((c,i)=>`<button type="button" class="search-item" data-customer="${i}"><b>${esc(c.full_name)}｜${esc(c.phone||"")}</b><div>${esc(c.customer_no)} ${esc(c.affiliated_organization||"")}</div><div class="muted">利用者：${esc((c.passengers||[]).map(p=>p.full_name).join("、")||"未登録")}</div></button>`).join("")||'<div class="empty">該当なし</div>';target.querySelectorAll("[data-customer]").forEach(b=>b.onclick=()=>{const c=j.items[Number(b.dataset.customer)];if(selectable)selectCustomer(c);else showCustomer(c)})}catch(e){toast(e.message,true)}}
function selectCustomer(c){$("selectedCustomerId").value=c.customer_id;$("pcCustomerName").value=c.full_name||"";$("pcCustomerPhone").value=c.phone||"";const p=(c.passengers||[])[0];if(p){$("selectedPassengerId").value=p.id;$("pcPassengerName").value=p.full_name||"";$("pcMobility").value=p.mobility_type||"walking";$("pcPickupName").value=p.default_pickup_place||"";$("pcPickupAddress").value=p.address||""}$("phoneSearchResults").innerHTML='<div class="alert">既存顧客を選択しました。</div>'}function showCustomer(c){$("customerResults").innerHTML=`<div class="box"><h3>${esc(c.full_name)}</h3><dl class="kv"><dt>顧客番号</dt><dd>${esc(c.customer_no)}</dd><dt>電話</dt><dd>${esc(c.phone||"-")}</dd><dt>最終利用</dt><dd>${esc(dt(c.last_used_at))}</dd><dt>利用者</dt><dd>${esc((c.passengers||[]).map(p=>p.full_name).join("、")||"-")}</dd><dt>内部メモ</dt><dd>${esc(c.internal_notes||"-")}</dd></dl></div>`}
$("phoneSearchBtn").onclick=()=>search($("phoneSearch").value,$("phoneSearchResults"),true);$("customerSearchBtn").onclick=()=>search($("customerQuery").value,$("customerResults"),false);
$("phoneForm").onsubmit=async e=>{e.preventDefault();$("phoneError").classList.add("hidden");try{const payload={customer:{id:$("selectedCustomerId").value||null,full_name:$("pcCustomerName").value,phone:$("pcCustomerPhone").value,customer_type:"family",relationship:"家族"},passenger:{id:$("selectedPassengerId").value||null,full_name:$("pcPassengerName").value,mobility_type:$("pcMobility").value},trip:{requested_pickup_at:new Date($("pcPickupAt").value).toISOString(),trip_type:$("pcTripType").value,return_mode:$("pcTripType").value==="round_trip"?"contact_when_ready":"none",pickup_place_name:$("pcPickupName").value,pickup_address:$("pcPickupAddress").value,destination_place_name:$("pcDestinationName").value,destination_address:$("pcDestinationAddress").value,service_purpose:$("pcPurpose").value,expected_duration_minutes:Number($("pcDuration").value),customer_notes:$("pcNotes").value}};const idem="phone_"+crypto.randomUUID().replaceAll("-","");const j=await api("/v1/admin/phone-trip",{method:"POST",body:{payload,idempotency_key:idem},idem});toast(`電話受付 ${j.trip_no} を登録しました`);close("phone");await load()}catch(err){$("phoneError").textContent=err.message;$("phoneError").classList.remove("hidden")}};
document.querySelectorAll(".toolbar [data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".toolbar [data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;renderTrips()});$("reloadBtn").onclick=load;$("targetDate").onchange=()=>{syncDateDisplay();load()};$("logoutBtn").onclick=()=>{clearSession();openLogin()};
const today=tokyoDateValue();setTargetDate(today);try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");if(s?.token){session=s;openApp();load()}else openLogin()}catch{openLogin()}
})();
</script></body></html>
