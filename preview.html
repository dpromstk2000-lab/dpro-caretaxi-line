<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#075d61">
  <meta name="robots" content="noindex,nofollow">
  <title>DPRO介護タクシー｜営業サイト用プレビュー</title>
  <style>
    :root{--main:#08777a;--deep:#064b50;--ink:#16393e;--muted:#667e82;--bg:#edf5f6;--card:#fff;--line:#cfe0e2;--soft:#f6fafb;--ok:#17794e;--warn:#a76600;--info:#2465a8;--danger:#ad3833;--purple:#5e43a3;--shadow:0 12px 34px rgba(20,75,82,.11)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}button,input{font:inherit}button{cursor:default}.hidden{display:none!important}
    body.embed .screen-tabs,body.embed .preview-foot{display:none}body.embed .top{position:static}body.embed .shell{padding-bottom:18px}
    .top{position:sticky;top:0;z-index:20;background:linear-gradient(118deg,var(--deep),var(--main));color:#fff;padding:14px 20px;box-shadow:0 3px 12px rgba(0,0,0,.14)}.top-in{max-width:1480px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand small{font-weight:900;letter-spacing:.14em}.brand h1{margin:1px 0 0;font-size:clamp(20px,3vw,29px)}.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:900;border:1px solid rgba(255,255,255,.5)}.badge.readonly{background:#fff;color:var(--deep);border-color:#fff}.badge i{width:8px;height:8px;border-radius:50%;background:#29c873;display:inline-block}
    .screen-tabs{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;overflow:auto;white-space:nowrap}.screen-tabs-in{max-width:1480px;margin:auto;display:flex;gap:7px}.screen-tabs a{color:var(--deep);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;background:#fff}.screen-tabs a.active{background:var(--main);border-color:var(--main);color:#fff}
    .shell{max-width:1480px;margin:auto;padding:16px 18px 44px}.notice{border:1px solid #e4c781;background:#fff6dd;color:#735000;border-radius:12px;padding:11px 14px;font-weight:800;margin-bottom:14px}.notice strong{color:#513600}.section-title{margin:0 0 10px;font-size:20px}.sub{color:var(--muted);font-size:14px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.tool{border:1px solid var(--line);background:#fff;color:var(--deep);padding:9px 13px;border-radius:9px;font-weight:800}.tool.active{background:var(--main);color:#fff;border-color:var(--main)}.tool[disabled]{opacity:.64}.spacer{flex:1}.date-chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:900}
    .metrics{display:grid;grid-template-columns:repeat(8,minmax(105px,1fr));gap:9px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:800}.metric strong{display:block;color:var(--deep);font-size:26px;margin-top:2px}.metric em{font-style:normal;color:var(--muted);font-size:12px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:19px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:11px 12px;border-bottom:1px solid #e7eeee;text-align:left;vertical-align:middle}th{background:#f6fafb;color:#4f6b70;font-size:12px}td{font-size:14px}.route b,.person b{display:block}.route small,.person small{display:block;color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;white-space:nowrap}.s-warn{background:#fff0ca;color:#805200}.s-info{background:#e4f0ff;color:#185a98}.s-purple{background:#eee8ff;color:#583994}.s-ok{background:#dff4e8;color:#126a41}.s-danger{background:#fde6e4;color:#a42f2a}.money{font-weight:900;color:var(--deep)}
    .board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow:auto;padding-bottom:4px}.lane{background:#e8f1f2;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:460px}.lane-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:900}.lane-head span:last-child{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}.trip-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:0 5px 15px rgba(25,70,75,.07)}.trip-card time{font-weight:900;color:var(--main)}.trip-card h3{margin:5px 0 3px;font-size:16px}.trip-card p{margin:3px 0;font-size:13px}.trip-card .assign{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:var(--muted);font-size:12px}
    .staff-head{display:grid;grid-template-columns:1.3fr .7fr;gap:10px;margin-bottom:12px}.driver-card,.progress-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.driver-card h2{margin:2px 0}.progress-bar{height:10px;background:#dfeaec;border-radius:999px;overflow:hidden;margin:9px 0}.progress-bar span{display:block;height:100%;background:var(--main);width:57%}.staff-list{display:grid;gap:11px}.staff-trip{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center}.staff-time{text-align:center;border-right:1px solid var(--line)}.staff-time strong{display:block;font-size:25px;color:var(--main)}.staff-trip h3{margin:0 0 5px}.staff-trip p{margin:2px 0}.action-set{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.action{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:9px;padding:8px 10px;font-weight:800}.action.primary{background:var(--main);color:#fff;border-color:var(--main)}.action[disabled]{opacity:.7}
    .billing-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.summary-box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.summary-box h2{margin:0 0 10px}.payment-list{display:grid;gap:8px}.payment-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e8eeee;padding:8px 0}.payment-row:last-child{border:0}.payment-row strong{color:var(--deep)}
    .ledger-layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(450px,1.6fr);gap:12px}.search-box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}.search-row{display:flex;gap:8px}.search-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#f9fbfb}.customer-list{display:grid;gap:8px;margin-top:10px}.customer{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.customer.active{border-color:var(--main);box-shadow:0 0 0 2px rgba(8,119,122,.12)}.customer b{display:block}.customer small{color:var(--muted)}.detail{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.detail h2{margin:0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.info-box{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fafcfc}.info-box h3{margin:0 0 7px;font-size:15px}.kv{display:grid;grid-template-columns:105px 1fr;gap:4px 8px;font-size:13px}.kv dt{color:var(--muted);font-weight:800}.kv dd{margin:0;font-weight:700}.history{margin-top:12px}.history-item{display:grid;grid-template-columns:115px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #e8eeee;font-size:13px}.history-item:last-child{border:0}
    .preview-foot{text-align:center;color:var(--muted);font-size:12px;padding:5px 15px 20px}.readonly-ribbon{position:fixed;right:14px;bottom:14px;z-index:30;background:#173e42;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    @media(max-width:1150px){.metrics{grid-template-columns:repeat(4,1fr)}.billing-grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(5,235px)}}
    @media(max-width:760px){body{font-size:15px}.top{padding:12px}.top-in{align-items:flex-start}.badges .badge:not(.readonly){display:none}.shell{padding:11px 9px 35px}.metrics{grid-template-columns:repeat(2,1fr)}.staff-head,.ledger-layout,.detail-grid{grid-template-columns:1fr}.staff-trip{grid-template-columns:78px 1fr}.action-set{grid-column:1/-1;justify-content:flex-start}.staff-time strong{font-size:20px}.screen-tabs{padding-left:9px}.notice{font-size:13px}.readonly-ribbon{right:8px;bottom:8px}.history-item{grid-template-columns:95px 1fr}.history-item span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand"><small>DPRO CARE TAXI</small><h1 id="screenTitle">営業サイト用プレビュー</h1></div>
      <div class="badges"><span class="badge"><i></i>架空デモデータ</span><span class="badge readonly">閲覧専用・更新なし</span></div>
    </div>
  </header>
  <nav class="screen-tabs" aria-label="プレビュー画面切替"><div class="screen-tabs-in" id="screenTabs"></div></nav>
  <main class="shell">
    <div class="notice"><strong>営業サイト専用：</strong>実データ・管理セッションを使用せず、架空情報だけを表示しています。登録・更新・削除・API通信は行われません。</div>
    <div id="screenRoot"></div>
  </main>
  <div class="preview-foot">STEP CARETAXI-12｜認証不要・読取専用プレビュー</div>
  <div class="readonly-ribbon">READ ONLY PREVIEW</div>
<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const screen = ["owner","dispatch","staff","billing","ledger"].includes(params.get("screen")) ? params.get("screen") : "owner";
  if (params.get("embed_demo") === "1") document.body.classList.add("embed");

  const labels = {owner:"管理者PC｜予約・配車管理",dispatch:"iPad配車｜進行ボード",staff:"スタッフ｜当日運行",billing:"料金・支払管理",ledger:"顧客・乗車者台帳"};
  const tabs = [{id:"owner",label:"管理者PC"},{id:"dispatch",label:"iPad配車"},{id:"staff",label:"スタッフ運行"},{id:"billing",label:"料金・支払"},{id:"ledger",label:"顧客台帳"}];
  document.getElementById("screenTitle").textContent = labels[screen];
  document.title = `DPRO介護タクシー｜${labels[screen]}`;
  document.getElementById("screenTabs").innerHTML = tabs.map(t => `<a class="${t.id===screen?"active":""}" href="./preview.html?screen=${t.id}">${t.label}</a>`).join("");

  const trips = [
    {time:"09:00",no:"CT-20260729-001",name:"山田 花子",customer:"山田 太郎（長男）",route:"自宅 → 福岡東医療センター",status:"運行中",statusClass:"s-purple",vehicle:"介護車両1号",driver:"佐藤 運転",amount:"6,500円"},
    {time:"10:30",no:"CT-20260729-002",name:"鈴木 一郎",customer:"鈴木 美咲（長女）",route:"東区ケアホーム → 博多総合病院",status:"配車済み",statusClass:"s-info",vehicle:"リフト車2号",driver:"鈴木 介助",amount:"8,200円"},
    {time:"13:00",no:"CT-20260729-003",name:"田中 和子",customer:"田中 健一（夫）",route:"自宅 → さくら整形外科",status:"未配車",statusClass:"s-warn",vehicle:"未設定",driver:"未設定",amount:"確認中"},
    {time:"15:30",no:"CT-20260729-004",name:"中村 正夫",customer:"中村 由美（妻）",route:"県立病院 → 自宅",status:"予約確定",statusClass:"s-ok",vehicle:"介護車両1号",driver:"佐藤 運転",amount:"7,300円"}
  ];

  function metrics(items){return `<section class="metrics">${items.map(([a,b,c=""])=>`<article class="metric"><span>${a}</span><strong>${b}</strong>${c?`<em>${c}</em>`:""}</article>`).join("")}</section>`}
  function owner(){return `${metrics([["本日の送迎","8"],["未確認","2"],["未配車","1"],["帰り待ち","1"],["運行中","2"],["本日完了","3"],["会員申請","1"],["未払い","2"]])}<div class="toolbar"><button class="tool active">すべて</button><button class="tool">未確認</button><button class="tool">本日</button><button class="tool">未配車</button><span class="spacer"></span><span class="date-chip">2026年7月29日（水）</span><button class="tool" disabled>＋ 電話受付</button></div><section class="panel"><div class="panel-head"><div><h2>送迎予約・当日運行</h2><div class="sub">4件を表示｜営業デモ用の架空データ</div></div><span class="status s-ok">システム正常</span></div><div class="table-wrap"><table><thead><tr><th>日時・受付</th><th>利用者</th><th>送迎区間</th><th>状態</th><th>配車</th><th>金額</th><th>操作</th></tr></thead><tbody>${trips.map(t=>`<tr><td><b>${t.time}</b><div class="sub">${t.no}</div></td><td class="person"><b>${t.name}</b><small>予約者：${t.customer}</small></td><td class="route"><b>${t.route}</b><small>車いす・乗降介助あり</small></td><td><span class="status ${t.statusClass}">${t.status}</span></td><td><b>${t.vehicle}</b><div class="sub">${t.driver}</div></td><td class="money">${t.amount}</td><td><button class="tool" disabled>詳細を見る</button></td></tr>`).join("")}</tbody></table></div></section>`}
  function dispatch(){const lanes=[{name:"要確認",items:[trips[2]]},{name:"未配車",items:[trips[2]]},{name:"配車済み",items:[trips[1],trips[3]]},{name:"運行中",items:[trips[0]]},{name:"帰り待ち",items:[{...trips[3],time:"16:40",name:"木村 幸子",route:"福岡記念病院 → 自宅",status:"帰り連絡待ち"}]}];return `<div class="toolbar"><button class="tool active">本日の配車</button><span class="date-chip">2026年7月29日（水）</span><span class="spacer"></span><button class="tool" disabled>重複チェック済み</button></div>${metrics([["要確認","2"],["未配車","1"],["配車済み","3"],["運行中","2"],["帰り待ち","1"],["利用車両","2台"],["運転者","2名"],["介助者","2名"]])}<div style="height:12px"></div><section class="board">${lanes.map(l=>`<div class="lane"><div class="lane-head"><span>${l.name}</span><span>${l.items.length}</span></div>${l.items.map(t=>`<article class="trip-card"><time>${t.time}</time><h3>${t.name}</h3><p>${t.route}</p><span class="status ${t.statusClass||"s-warn"}">${t.status}</span><div class="assign">${t.vehicle}<br>${t.driver}</div></article>`).join("")}</div>`).join("")}</section>`}
  function staff(){return `<section class="staff-head"><article class="driver-card"><div class="sub">ログインスタッフ</div><h2>佐藤 運転</h2><p>介護車両1号｜本日の担当 3件</p><span class="status s-ok">勤務中</span></article><article class="progress-card"><div class="sub">本日の進行</div><h2>4 / 7 ステップ</h2><div class="progress-bar"><span></span></div><p>現在：山田 花子様を目的地へ送迎中</p></article></section><div class="toolbar"><button class="tool active">担当する送迎</button><span class="date-chip">2026年7月29日（水）</span><span class="spacer"></span><button class="tool" disabled>事故・ヒヤリハット報告</button></div><section class="staff-list">${trips.slice(0,3).map((t,i)=>`<article class="staff-trip"><div class="staff-time"><strong>${t.time}</strong><span>${i===0?"運行中":i===1?"次の送迎":"午後"}</span></div><div><h3>${t.name}様</h3><p><b>${t.route}</b></p><p class="sub">${i===0?"車いす・玄関段差あり・ご家族同乗":"連絡先確認済み・乗降介助あり"}</p><span class="status ${i===0?"s-purple":i===1?"s-info":"s-warn"}">${i===0?"目的地へ移動中":i===1?"配車済み":"出発準備前"}</span></div><div class="action-set"><button class="action" disabled>電話</button><button class="action" disabled>地図</button><button class="action primary" disabled>${i===0?"目的地到着":"詳細確認"}</button></div></article>`).join("")}</section>`}
  function billing(){return `${metrics([["見積総額","28,300円"],["確定料金","22,000円"],["入金済み","14,700円"],["未払い","7,300円"],["見積待ち","1件"],["一部入金","1件"],["支払済み","2件"],["本日入金","6,500円"]])}<div class="toolbar"><button class="tool active">本日の料金</button><button class="tool">未払い</button><button class="tool">見積待ち</button><span class="spacer"></span><span class="date-chip">2026年7月29日（水）</span></div><section class="billing-grid"><div class="panel"><div class="panel-head"><div><h2>見積・確定料金・入金状況</h2><div class="sub">予約単位で内訳と残額を確認</div></div></div><div class="table-wrap"><table><thead><tr><th>予約</th><th>利用者</th><th>見積</th><th>確定料金</th><th>入金</th><th>残額</th><th>状態</th></tr></thead><tbody>${trips.map((t,i)=>{const paid=[6500,4000,0,4200][i], total=[6500,8200,6300,7300][i], remain=total-paid;return `<tr><td><b>${t.no}</b><div class="sub">${t.time}</div></td><td>${t.name}</td><td class="money">${i===2?"確認中":total.toLocaleString()+"円"}</td><td class="money">${i===2?"未確定":total.toLocaleString()+"円"}</td><td class="money">${paid.toLocaleString()}円</td><td class="money">${remain.toLocaleString()}円</td><td><span class="status ${remain===0?"s-ok":paid?"s-info":"s-warn"}">${remain===0?"支払済み":paid?"一部入金":"未払い"}</span></td></tr>`}).join("")}</tbody></table></div></div><aside class="summary-box"><h2>料金内訳サンプル</h2><p class="sub">CT-20260729-001｜山田 花子様</p><div class="payment-list"><div class="payment-row"><span>迎車料金</span><strong>700円</strong></div><div class="payment-row"><span>距離制運賃</span><strong>3,600円</strong></div><div class="payment-row"><span>乗降介助</span><strong>1,200円</strong></div><div class="payment-row"><span>車いす使用</span><strong>500円</strong></div><div class="payment-row"><span>消費税等</span><strong>500円</strong></div><div class="payment-row"><b>合計</b><strong>6,500円</strong></div></div><button class="tool" disabled style="width:100%;margin-top:10px">閲覧専用・入金登録なし</button></aside></section>`}
