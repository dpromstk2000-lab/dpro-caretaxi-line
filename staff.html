<head>

<style>
:root{--main:#08676a;--deep:#064b50;--bg:#edf4f5;--card:#fff;--line:#c7dadd;--muted:#61787d;--danger:#b93732;--warn:#a96700;--ok:#176b45;--blue:#2469aa;--shadow:0 8px 25px rgba(20,68,74,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#17383c;font-size:17px}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#e8f2f3,#d4e7e9)}.login-card{width:min(540px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(5,75,80,.2)}.login-card small{font-weight:900;letter-spacing:.12em}.login-card h1{margin:5px 0}.login-card p{color:var(--muted);line-height:1.6}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:14px;font-weight:900}.field input,.field select,.field textarea{width:100%;min-height:52px;border:1px solid #b7cfd2;border-radius:12px;background:#fff;padding:11px 13px}.field textarea{min-height:100px;resize:vertical}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{min-height:48px;border:1px solid var(--line);border-radius:11px;background:#eef6f6;color:var(--deep);font-weight:900}.code{display:flex;gap:8px}.code input{flex:1}.code button{width:54px;border:1px solid var(--line);border-radius:11px;background:#eef5f6;font-size:23px}.btn{min-height:50px;border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:#fff;color:var(--deep);font-weight:950}.btn-main{background:var(--main);border-color:var(--main);color:#fff}.btn-danger{background:#fff3f2;border-color:#e6aaa6;color:#a52e29}.btn-warn{background:#fff8e8;border-color:#dfb75d;color:#825000}.login-card>.btn-main{width:100%;margin-top:8px}.error{border:1px solid #e8aaa6;background:#fff0ef;color:#a42d28;padding:10px;border-radius:10px;margin:10px 0}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--deep),var(--main));color:#fff;padding:12px 15px;box-shadow:0 3px 14px rgba(0,0,0,.16)}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand small{display:block;font-size:10px;font-weight:900;letter-spacing:.15em}.brand h1{font-size:22px;margin:2px 0}.topactions{display:flex;gap:7px}.topactions button,.pill{min-height:45px;border-radius:11px;font-weight:900}.topactions button{border:0;background:#fff;color:var(--deep);padding:0 13px}.pill{display:grid;place-items:center;border:1px solid rgba(255,255,255,.45);padding:0 12px}
.shell{width:min(1020px,100%);margin:auto;padding:12px 12px 90px}.datebar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-bottom:10px}.datebar button,.datebar input{min-height:49px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--deep);padding:8px 12px;font-weight:900}.datebar input{text-align:center}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:850}.stat strong{font-size:27px;color:var(--deep)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 8px}.section-title h2{font-size:20px;margin:0}.section-title span{font-size:13px;color:var(--muted)}.list{display:grid;gap:10px}.trip{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.trip-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid #e1ebec}.time{font-size:25px;font-weight:950;color:var(--deep)}.tripno{font-size:11px;color:var(--muted);font-weight:850}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;background:#e5efff;color:#245e9e}.status.operating{background:#ede6ff;color:#5b3da0}.status.done{background:#def4e7;color:#176941}.trip-body{padding:13px 14px}.passenger{font-size:23px;font-weight:950}.role{font-size:13px;color:var(--muted);font-weight:850}.route{margin-top:9px;padding:10px;background:#f2f7f8;border-radius:11px;font-weight:900}.arrow{color:var(--main);padding:0 6px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.meta div{background:#f7fafb;border-radius:9px;padding:8px;font-size:13px}.meta span{display:block;color:var(--muted);font-size:10px;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.empty{text-align:center;padding:45px 12px;color:var(--muted);font-weight:850;background:#fff;border-radius:15px}
.detail{position:fixed;inset:0;z-index:70;display:none}.detail.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(8,38,42,.52)}.sheet{position:absolute;right:0;top:0;bottom:0;width:min(650px,100vw);background:#f2f8f9;overflow:auto;box-shadow:-20px 0 55px rgba(0,0,0,.25)}.sheethead{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:13px 15px}.sheethead h2{margin:0;font-size:21px}.close{width:48px;height:48px;border:0;border-radius:11px;background:#e8f1f2;font-size:25px}.sheetbody{padding:12px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.box h3{margin:0 0 9px;font-size:18px}.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;margin:0}.kv dt{color:var(--muted);font-weight:850}.kv dd{margin:0;font-weight:850;word-break:break-word}.callmap{display:grid;grid-template-columns:1fr 1fr;gap:8px}.callmap a{display:grid;place-items:center;min-height:52px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--deep);background:#fff;font-weight:950}.callmap a.primary{background:var(--main);border-color:var(--main);color:#fff}.progress{display:grid;gap:8px}.next{min-height:62px;font-size:18px}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.timeline div{background:#f5f9fa;border-radius:9px;padding:8px;font-size:12px}.timeline span{display:block;color:var(--muted);font-size:10px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.history{display:grid;gap:7px}.incident{border-left:5px solid #e6a645;background:#fff8e9;border-radius:8px;padding:8px;font-size:13px}.incident.high{border-color:#d0524b;background:#fff1f0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:none;background:#153f43;color:#fff;border-radius:12px;padding:12px 18px;font-weight:850;box-shadow:var(--shadow)}.toast.show{display:block}.toast.bad{background:#a83731}
@media(max-width:720px){html,body{font-size:16px}.brand h1{font-size:18px}.pill{display:none}.topactions button{padding:0 9px}.summary{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:1fr 1fr}.sheet{width:100vw}.report-grid{grid-template-columns:1fr}.wide{grid-column:auto}.timeline{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}}

/* CARETAXI-11 最終UI・アクセシビリティ調整 */
:focus-visible{outline:3px solid #f5a623!important;outline-offset:2px!important}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.62}
.date-control{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;min-width:230px;border:1px solid var(--line,#c7dadd);border-radius:10px;background:#fff;color:var(--deep,#064c51);font-weight:900;padding:0 44px 0 14px;overflow:hidden}
.date-control::after{content:"📅";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.date-control .date-display{pointer-events:none;white-space:nowrap}
.date-control input[type="date"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
@media(max-width:650px){.date-control{min-width:0;width:100%;font-size:14px;padding-left:10px;padding-right:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* DPRO-SYSTEMS-5 CARETAXI OPERATION DEMO */
.operation-demo-banner{
  width:min(1080px,calc(100% - 28px));

}

.top .official-demo-link{

@media(max-width:720px){

  }
  .operation-demo-banner a{width:100%}

}

</head><body class="operation-demo-page">
<div id="loginView" class="login"><form id="loginForm" class="login-card"><small>DPRO CARE TAXI / OPERATION DEMO</small><h1>スタッフ当日運行 操作デモ</h1><p>担当する送迎だけを表示し、電話・地図・運行状況をスマートフォンから操作します。</p><div id="loginError" class="error hidden" role="alert"></div><div class="field"><label>デモスタッフを選ぶ</label><div class="quick"><button type="button" data-demo="DEMO-STAFF-001">佐藤 運転</button><button type="button" data-demo="DEMO-STAFF-002">鈴木 介助</button></div></div><div class="field"><label for="staffCode">スタッフコード</label><input id="staffCode" autocomplete="username" placeholder="例：DEMO-STAFF-001" required></div><div class="field"><label for="accessCode">スタッフ用コード</label><div class="code"><input id="accessCode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="デモ：1234" required><button id="clearCode" type="button" aria-label="コードを消す">×</button></div></div><button class="btn btn-main" type="submit">本日の担当を開く</button><a class="official-demo-link" href="https://dpro-shop.com/systems/caretaxi">公式の機能説明を見る</a></form></div>
<div id="appView" class="hidden"><header class="top"><div class="topin"><div class="brand"><small>DPRO CARE TAXI</small><h1 id="staffTitle">スタッフ運行</h1></div><div class="topactions"><span id="envPill" class="pill">公開デモ</span><a class="official-demo-link" href="https://dpro-shop.com/systems/caretaxi">公式説明</a><button id="reloadBtn" type="button">更新</button><button id="logoutBtn" type="button">終了</button></div></div></header><main class="shell"><section class="datebar"><button id="prevDate" type="button">← 前日</button><label class="date-control"><span id="dateDisplay" class="date-display">日付を選択</span><input id="targetDate" type="date" aria-label="表示日を選択"></label><button id="nextDate" type="button">翌日 →</button></section><section id="summary" class="summary"></section><div class="section-title"><h2>担当する送迎</h2><span id="listNote"></span></div><section id="tripList" class="list"></section></main></div>
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true"><div class="backdrop" data-close="1"></div><aside class="sheet"><div class="sheethead"><h2 id="detailTitle">送迎詳細</h2><button class="close" aria-label="閉じる" data-close="1" type="button">×</button></div><div id="detailBody" class="sheetbody"></div></aside></div><div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
(()=>{"use strict";const C=window.CARETAXI_CONFIG||{},API=String(C.API_BASE_URL||"").replace(/\/+$/,"");const ORG=C.ORGANIZATION_CODE||"dpro_caretaxi_demo",KEY=C.STAFF_SESSION_KEY||"dpro_caretaxi_staff_session_v1",BUSINESS_PHONE=C.BUSINESS_PHONE||"";const $=id=>document.getElementById(id);let session=null,data={trips:[],counts:{}},current=null;
const labels={requested:"受付",reviewing:"確認中",confirmed:"予約確定",assigned:"配車済み",ready:"出発準備",departed:"出発",arrived_pickup:"お迎え到着",passenger_onboard:"乗車中",arrived_destination:"目的地到着",return_waiting:"帰り待ち",completed:"完了",cancelled:"取消",rejected:"対応不可"};const mobility={walking:"歩行",cane:"杖",walker:"歩行器",wheelchair:"車いす",reclining_wheelchair:"リクライニング車いす",stretcher:"ストレッチャー",other:"その他"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function saveSession(j){session={token:j.token,expires_at:Date.now()+Number(j.expires_in||900)*1000,staff:j.staff};sessionStorage.setItem(KEY,JSON.stringify(session))}function clearSession(){session=null;sessionStorage.removeItem(KEY)}function headers(){return session?.token?{Authorization:`Bearer ${session.token}`}:{}}
async function api(path,{method="GET",body}={}){const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...headers()},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(r.status===401){clearSession();showLogin();throw new Error("セッションの有効期限が切れました。再度ログインしてください。")}if(!r.ok||j.ok===false)throw new Error(j.message||j.error?.message||`通信エラー (${r.status})`);return j}function toast(m,b=false){const t=$("toast");t.textContent=m;t.className="toast show"+(b?" bad":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className="toast",2600)}function showLogin(){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden")}function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}
function tokyoDateValue(value=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(value)}
function dateDisplayText(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||"")))return"日付を選択";const [y,m,d]=value.split("-").map(Number);const weekday=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",weekday:"short"}).format(new Date(`${value}T12:00:00+09:00`));return `${y}年${m}月${d}日（${weekday}）`}
function syncDateDisplay(){const e=$("dateDisplay");if(e)e.textContent=dateDisplayText($("targetDate").value)}
function setTargetDate(value,reload=false){$("targetDate").value=value;syncDateDisplay();if(reload)load()}
function shiftTargetDate(days){const value=$("targetDate").value||tokyoDateValue();const [y,m,d]=value.split("-").map(Number);const shifted=new Date(Date.UTC(y,m-1,d+days,3,0,0));setTargetDate(tokyoDateValue(shifted),true)}
function time(v){if(!v)return"--:--";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}function datetime(v){if(!v)return"-";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}function maps(a){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a||"")}`}function tel(v){return `tel:${String(v||"").replace(/[^0-9+]/g,"")}`}function isOperating(s){return["departed","arrived_pickup","passenger_onboard","arrived_destination"].includes(s)}
function nextAction(s){return({confirmed:["ready","出発準備にする"],assigned:["ready","出発準備にする"],ready:["depart","事業所を出発"],departed:["arrive_pickup","お迎え先に到着"],arrived_pickup:["onboard","乗車完了"],passenger_onboard:["arrive_destination","目的地に到着"],arrived_destination:["complete","降車・介助を完了"]})[s]||null}
function renderSummary(){const c=data.counts||{},items=[["担当",c.assigned_today||0],["これから",c.upcoming||0],["運行中",c.operating||0],["完了",c.completed||0],["報告",c.incidents_today||0]];$("summary").innerHTML=items.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}function card(t){const statusClass=isOperating(t.leg_status)?" operating":t.leg_status==="completed"?" done":"";return `<article class="trip"><div class="trip-head"><div><div class="time">${esc(time(t.scheduled_pickup_at||t.reserved_from))}</div><div class="tripno">${esc(t.trip_no)}／${t.leg_type==="return"?"帰り":"行き"}</div></div><span class="status${statusClass}">${esc(labels[t.leg_status]||t.leg_status)}</span></div><div class="trip-body"><div class="passenger">${esc(t.passenger_name)}</div><div class="role">担当：${esc(t.assignment_role==="driver"?"運転":"介助")}</div><div class="route">${esc(t.pickup_place_name||"お迎え先")}<span class="arrow">→</span>${esc(t.destination_place_name||"目的地")}</div><div class="meta"><div><span>移動方法</span>${esc(mobility[t.mobility_type]||t.mobility_type||"-")}</div><div><span>車両</span>${esc(t.vehicle_name||"未設定")}</div><div><span>報告</span>${Number(t.incident_count||0)}件</div></div><div class="actions"><button class="btn" type="button" data-detail="${t.trip_leg_id}">詳細・連絡</button><button class="btn btn-main" type="button" data-start="${t.trip_leg_id}">${esc(nextAction(t.leg_status)?.[1]||"状態を確認")}</button></div></div></article>`}
function render() {renderSummary();$("listNote").textContent=`${data.staff?.name||""}／${data.date||""}`;$("tripList").innerHTML=(data.trips||[]).map(card).join("")||'<div class="empty">この日の担当送迎はありません。</div>';document.querySelectorAll("[data-detail],[data-start]").forEach(b=>b.onclick=()=>openDetail(b.dataset.detail||b.dataset.start))}
async function load(){try{data=await api("/v1/staff/today",{method:"POST",body:{target_date:$("targetDate").value}});$("staffTitle").textContent=`${data.staff?.name||"スタッフ"}｜当日運行`;$("envPill").textContent=data.organization?.is_demo?"デモ環境":"本番環境";render()}catch(e){if(/セッション|ログイン/.test(e.message)){clearSession();showLogin()}toast(e.message,true)}}
async function openDetail(id){try{current=await api("/v1/staff/trip-detail",{method:"POST",body:{trip_leg_id:id}});renderDetail();$("detail").classList.add("open");$("detail").setAttribute("aria-hidden","false")}catch(e){toast(e.message,true)}}
function renderDetail(){const x=current,t=x.trip,l=x.leg,p=x.passenger,v=x.vehicle||{},next=nextAction(l.status);$("detailTitle").textContent=`${t.trip_no}｜${p.name}`;const team=(x.team||[]).map(a=>`${esc(a.name)}（${a.role==="driver"?"運転":"介助"}）`).join("、")||"-",eq=(x.equipment||[]).map(e=>esc(e.name)).join("、")||"なし";$("detailBody").innerHTML=`<div class="box"><h3>送迎・利用者</h3><dl class="kv"><dt>状態</dt><dd>${esc(labels[l.status]||l.status)}</dd><dt>予定</dt><dd>${esc(datetime(l.scheduled_pickup_at||l.reserved_from))}</dd><dt>利用者</dt><dd>${esc(p.name)}／${esc(mobility[t.mobility_type]||mobility[p.mobility_type]||p.mobility_type||"-")}</dd><dt>車両</dt><dd>${esc(v.name||"未設定")} ${esc(v.license_plate||"")}</dd><dt>担当</dt><dd>${team}</dd><dt>福祉機器</dt><dd>${eq}</dd><dt>介助</dt><dd>${esc(t.assistance_summary||"-")}</dd><dt>安全上の注意</dt><dd>${esc(p.safety_notes||"-")}</dd><dt>階段・入口</dt><dd>${esc([p.stairs_notes,p.building_access_notes].filter(Boolean).join("／")||"-")}</dd></dl></div><div class="box"><h3>お迎え先</h3><dl class="kv"><dt>場所</dt><dd>${esc(l.pickup_place_name||"")}<br>${esc(l.pickup_address||"")}</dd><dt>注意</dt><dd>${esc(l.pickup_notes||"-")}</dd></dl><div class="callmap"><a class="primary" href="${esc(tel(l.pickup_phone||p.phone))}">電話をかける</a><a href="${esc(maps(l.pickup_address))}" target="_blank" rel="noopener">地図を開く</a></div></div><div class="box"><h3>目的地</h3><dl class="kv"><dt>場所</dt><dd>${esc(l.destination_place_name||"")}<br>${esc(l.destination_address||"")}</dd><dt>注意</dt><dd>${esc(l.destination_notes||"-")}</dd></dl><div class="callmap"><a href="${esc(tel(l.destination_phone))}">目的地へ電話</a><a href="${esc(maps(l.destination_address))}" target="_blank" rel="noopener">地図を開く</a></div></div><div class="box"><h3>緊急連絡先</h3><dl class="kv"><dt>氏名</dt><dd>${esc(p.emergency_contact_name||"未登録")}</dd><dt>電話</dt><dd>${esc(p.emergency_contact_phone||"未登録")}</dd></dl><div class="callmap">${p.emergency_contact_phone?`<a class="btn-danger" href="${esc(tel(p.emergency_contact_phone))}">緊急連絡先へ電話</a>`:'<span></span>'}${BUSINESS_PHONE?`<a class="primary" href="${esc(tel(BUSINESS_PHONE))}">事業所へ電話</a>`:''}</div></div><div class="box"><h3>運行状態</h3><div class="timeline"><div><span>出発</span>${esc(time(l.actual_departed_at))}</div><div><span>お迎え到着</span>${esc(time(l.actual_arrived_pickup_at))}</div><div><span>乗車</span>${esc(time(l.actual_onboard_at))}</div><div><span>目的地到着</span>${esc(time(l.actual_arrived_destination_at))}</div><div><span>完了</span>${esc(time(l.actual_completed_at))}</div></div><div class="field"><label>運行メモ（任意）</label><textarea id="statusNote" placeholder="遅延理由や引継ぎ事項"></textarea></div><div class="progress">${next?`<button id="nextStatus" class="btn btn-main next" type="button">${esc(next[1])}</button>`:'<div class="empty">この送迎の運行更新は完了しています。</div>'}</div></div><div class="box"><h3>遅延・事故・ヒヤリハット報告</h3><div class="report-grid"><div class="field"><label>報告種別</label><select id="incidentType"><option value="delay">遅延</option><option value="passenger_absent">利用者不在</option><option value="unable_to_board">乗車不能</option><option value="vehicle_problem">車両トラブル</option><option value="accident">事故</option><option value="near_miss">ヒヤリハット</option><option value="complaint">苦情</option><option value="other">その他</option></select></div><div class="field"><label>重要度</label><select id="severity"><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="critical">緊急</option></select></div><div class="field wide"><label>内容</label><textarea id="incidentSummary" placeholder="何が起きたかを入力"></textarea></div><div class="field wide"><label>実施した対応</label><textarea id="actionTaken" placeholder="事業所へ連絡、利用者へ説明など"></textarea></div><button id="incidentBtn" class="btn btn-warn wide" type="button">事業所へ報告を登録</button></div></div><div class="box"><h3>過去の報告</h3><div class="history">${(x.incidents||[]).map(i=>`<div class="incident ${["high","critical"].includes(i.severity)?"high":""}"><b>${esc(i.type)}／${esc(i.severity)}</b><br>${esc(i.summary)}<br><small>${esc(datetime(i.occurred_at))}</small></div>`).join("")||"報告はありません。"}</div></div>`;if(next)$("nextStatus").onclick=()=>updateStatus(l.id,next[0]);$("incidentBtn").onclick=()=>reportIncident(l.id)}
async function updateStatus(id,action){try{const label=nextAction(current.leg.status)?.[1]||"更新";if(!confirm(`${label}として記録しますか？`))return;await api("/v1/staff/status-update",{method:"POST",body:{trip_leg_id:id,action,note:$("statusNote")?.value||null}});toast("運行状態を更新しました");await load();await openDetail(id)}catch(e){toast(e.message,true)}}async function reportIncident(id){try{const summary=$("incidentSummary").value.trim();if(summary.length<2)throw new Error("報告内容を入力してください。");if(!confirm("この内容を事業所へ報告しますか？"))return;await api("/v1/staff/incident",{method:"POST",body:{trip_leg_id:id,incident_type:$("incidentType").value,severity:$("severity").value,summary,action_taken:$("actionTaken").value.trim()||null}});toast("報告を登録しました");await load();await openDetail(id)}catch(e){toast(e.message,true)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").classList.add("hidden");try{const j=await api("/v1/auth/staff",{method:"POST",body:{staff_code:$("staffCode").value.trim(),access_code:$("accessCode").value,organization_code:ORG}});saveSession(j);showApp();await load()}catch(err){$("loginError").textContent=err.message;$("loginError").classList.remove("hidden")}};document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{$("staffCode").value=b.dataset.demo;$("accessCode").value="1234"});$("clearCode").onclick=()=>{$("accessCode").value="";$("accessCode").focus()};$("reloadBtn").onclick=load;$("logoutBtn").onclick=()=>{clearSession();showLogin()};$("targetDate").onchange=()=>{syncDateDisplay();load()};function addDate(n){shiftTargetDate(n)}$("prevDate").onclick=()=>addDate(-1);$("nextDate").onclick=()=>addDate(1);document.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>{$("detail").classList.remove("open");$("detail").setAttribute("aria-hidden","true");current=null});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("detail").classList.contains("open")){$("detail").classList.remove("open");$("detail").setAttribute("aria-hidden","true");current=null}});setTargetDate(tokyoDateValue());try{const s=JSON.parse(sessionStorage.getItem(KEY)||"null");if(s?.token&&Number(s.expires_at||0)>Date.now()){session=s;showApp();load()}else{clearSession();showLogin()}}catch{clearSession();showLogin()}
})();
</script></body></html>
